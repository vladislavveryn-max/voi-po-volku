<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Игра Престолов: Вой по волку</title>
<meta name="description" content="Ролевая игра живого действия «Игра Престолов: Вой по волку»: об игре, лор и сетка ролей.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: sticky iron topbar (sigil + title + tabs) over a torch-lit hero; content column below.
   Lore = sticky index + reading pane; roles = house sections with framed portrait cards. */
:root{
  --bg:#0d0e11; --bg-2:#121318; --surface:#17181e; --raised:#1f2027; --line:#2a2b33;
  --gold:#c9a65e; --gold-hi:#e3c482; --gold-line:rgba(201,166,94,.32);
  --crimson:#8f2b24; --crimson-hi:#ab372e;
  --fg:#ebe4d4; --muted:#9b9485; --ok:#8aac77;
  --display:"Forum","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --tb:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tb) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(13,14,17,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold-line)}
.tb-row{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{flex:none;width:26px;height:30px}
.brand-name{font-family:var(--display);font-size:21px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{position:relative;background:none;border:0;padding:18px 14px;cursor:pointer;color:var(--muted);
  font-family:var(--display);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--gold)}
.tb-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.icon-btn:hover{color:var(--fg);border-color:var(--gold-line)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--gold-line);
  background:
    radial-gradient(90% 120% at 15% 0%, rgba(143,43,36,.28), transparent 60%),
    radial-gradient(70% 90% at 100% 100%, rgba(201,166,94,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg))}
.hero .col{padding-block:56px 48px;display:grid;gap:18px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,var(--gold),transparent)}
.hero h1{font-size:clamp(38px,7.4vw,82px);color:var(--fg);letter-spacing:.015em}
.hero h1 .sep{color:var(--gold)}
.lead{max-width:64ch;font-size:18px;color:#d8d0bf}
.lead p{margin:0 0 .8em}.lead p:last-child{margin:0}
.hero-mark{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:min(42vw,420px);opacity:.07;pointer-events:none}

/* page */
main.col{padding-block:36px 140px}
.section-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-title h2{font-size:clamp(28px,4vw,38px)}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.prose{max-width:68ch}
.prose h3{font-size:30px;margin:1.5em 0 .45em;color:var(--gold-hi)}
.prose h4{font-size:23px;margin:1.3em 0 .35em}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1.1em;padding-left:0;list-style:none}
.prose li{position:relative;padding-left:22px;margin-bottom:.4em}
.prose li::before{content:"";position:absolute;left:4px;top:.68em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prose strong{color:#fff3dc;font-weight:600}
.empty{color:var(--muted);font-style:italic}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:6px;
  padding:9px 16px;font-size:15px;cursor:pointer;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.primary:hover{background:var(--crimson-hi)}
.btn.gold{background:transparent;border-color:var(--gold-line);color:var(--gold-hi)}
.btn.danger{color:#eaa497;border-color:rgba(171,55,46,.6);background:transparent}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:grid;gap:5px;margin-bottom:16px}
.field label,.field .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-line);outline:none}
.field textarea{line-height:1.6;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.edit-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--gold-line);background:rgba(201,166,94,.06);
  border-radius:8px;padding:10px 14px;font-size:14px;color:#d9cfb9;margin-bottom:24px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* lore */
.lore{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:2px;max-height:calc(100vh - var(--tb) - 60px);overflow:auto;padding-right:4px}
.lore-nav .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.lore-item{display:flex;align-items:center}
.lore-link{flex:1;min-width:0;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1.3}
.lore-link:hover{color:var(--fg);background:var(--surface)}
.lore-link[aria-current="true"]{color:var(--gold-hi);background:var(--surface)}
.mv{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:11px}
.lore-article h2{font-size:clamp(32px,5vw,46px);margin-bottom:18px}

/* roles */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:30px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.team{margin-bottom:52px}
.team-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.team-head h2{font-size:clamp(28px,4vw,36px)}
.team-count{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums;padding-bottom:5px}
.team-head .actions{margin-left:auto}
.team-rule{height:1px;background:linear-gradient(90deg,var(--gold-line),transparent);margin-bottom:12px}
.team-desc{color:var(--muted);margin:0 0 20px;max-width:68ch;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold-line)}
.portrait{position:relative;aspect-ratio:3/4;max-width:100%;background:radial-gradient(80% 60% at 50% 35%,#24252d,#121318);display:grid;place-items:center;overflow:hidden}
.portrait::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,94,.22);border-radius:3px;pointer-events:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .initial{font-family:var(--display);font-size:84px;color:rgba(201,166,94,.28)}
.card-body{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.card h3{font-size:24px;line-height:1.05}
.rtitle{font-size:14px;color:var(--gold);font-style:italic}
.card p{margin:2px 0 0;font-size:15px;line-height:1.5;color:#d6cebd}
.status{justify-self:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-top:6px}
.status.free{color:var(--ok);border:1px solid rgba(138,172,119,.45)}
.status.taken{color:var(--muted);border:1px solid var(--line)}
.card-tools{display:flex;gap:6px;padding:0 16px 14px}
.add-card{border:1px dashed var(--gold-line);border-radius:8px;background:rgba(201,166,94,.03);color:var(--gold);cursor:pointer;min-height:200px;font-size:16px;font-family:var(--display);letter-spacing:.05em}
.add-card:hover{background:rgba(201,166,94,.07)}

/* save bar, modal, toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(31,32,39,.97);border-top:1px solid var(--gold-line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:160px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border:1px solid var(--gold-line);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px}
.modal h2{font-size:30px;margin-bottom:18px}
.modal .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal .foot .grow{flex:1}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .thumb{width:84px;aspect-ratio:3/4;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;flex:none}
.photo-pick .thumb img{width:100%;height:100%;object-fit:cover}
.pin-input{text-align:center;font-family:var(--display);font-size:34px!important;letter-spacing:.5em;padding-left:calc(12px + .5em)!important}
.err{color:#eaa497;font-size:14px;min-height:1.3em;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--gold);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
footer.col{padding-block:0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}

/* mobile */
@media (max-width:820px){
  .tb-row{flex-wrap:wrap;gap:0;min-height:0}
  .brand{flex:1;padding:10px 0}
  .brand-name{font-size:19px}
  .tabs{order:3;width:100%;margin:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .tab{padding:11px 4px;font-size:16px;text-align:center}
  .tab[aria-selected="true"]::after{left:18%;right:18%}
  .icon-btn .lbl{display:none}
  .icon-btn{padding:8px}
  .hero .col{padding-block:36px 32px}
  .lead{font-size:16.5px}
  .hero-mark{width:60vw;right:-60px;opacity:.06}
  main.col{padding-block:26px 130px}
  .lore{grid-template-columns:1fr;gap:18px}
  .lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:6px;overflow-x:auto;max-height:none;padding:10px 0;margin:0 -16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .lore-nav::-webkit-scrollbar{display:none}
  .lore-nav .cap{display:none}
  .lore-item{flex:none}
  .lore-link{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
  .lore-link[aria-current="true"]{border-color:var(--gold);background:transparent}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-body{padding:10px 12px 12px}
  .card h3{font-size:20px}
  .card p{font-size:14px}
  .card-tools{padding:0 12px 12px;flex-wrap:wrap}
  .add-card{min-height:160px}
  .modal-bg{place-items:end center;padding:0}
  .modal{width:100%;border-radius:16px 16px 0 0;max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const SB_URL='https://osteatakzwgqvsmsauls.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zdGVhdGFrendncXZzbXNhdWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTM0MzQsImV4cCI6MjEwNzg2OTQzNH0.pMWIE_sNH-G4BYDou-2wZ7iVtLOSlsAVGMPnDkxxAl4';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});

let S={hero:{eyebrow:'Ролевая игра живого действия',title:'Игра Престолов: Вой по волку',text:''},about:'',lore:[],teams:[],roles:[]};
let saved=JSON.stringify(S);
let photos={};               // id -> data URI
let pin=null; try{pin=sessionStorage.getItem('vpv-pin')}catch(_){}
const ui={tab:'about',lore:null,filter:'all',edit:false,saving:false,err:'',modal:null,loading:true,loadErr:false,toast:''};

const TABS=[['about','Об игре'],['lore','Лор игры'],['roles','Сетка ролей']];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,10);
const dirty=()=>JSON.stringify(S)!==saved;
const isMaster=()=>!!pin;

const SIGIL=`<svg viewBox="0 0 26 30" aria-hidden="true"><path d="M13 1 L25 5 V14 C25 21.5 19.8 26.6 13 29 C6.2 26.6 1 21.5 1 14 V5 Z" fill="none" stroke="#c9a65e" stroke-width="1.4"/><path d="M8 19 L10 11 L12.4 14.5 L13 9 L13.6 14.5 L16 11 L18 19 Q13 16.5 8 19Z" fill="#c9a65e"/></svg>`;
const MARK=`<svg class="hero-mark" viewBox="0 0 200 230" aria-hidden="true"><path d="M100 4 L192 34 V104 C192 162 152 202 100 226 C48 202 8 162 8 104 V34 Z" fill="none" stroke="#c9a65e" stroke-width="3"/><path d="M58 150 L72 88 L90 116 L100 64 L110 116 L128 88 L142 150 Q100 128 58 150Z" fill="#c9a65e"/></svg>`;
const ICON_LOCK=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
const ICON_PEN=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/></svg>`;
const ICON_OUT=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3H3v10h3M10 5l3 3-3 3M13 8H6"/></svg>`;

function inline(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(text){
  return h(text||'').split(/\n\s*\n/).map(b=>{
    b=b.trim(); if(!b) return '';
    if(b.startsWith('### ')) return '<h4>'+inline(b.slice(4))+'</h4>';
    if(b.startsWith('## ')){const [f,...r]=b.split('\n');return '<h3>'+inline(f.slice(3))+'</h3>'+(r.length?md(r.join('\n')):'')}
    const L=b.split('\n');
    if(L.every(l=>/^\s*-\s/.test(l))) return '<ul>'+L.map(l=>'<li>'+inline(l.replace(/^\s*-\s/,''))+'</li>').join('')+'</ul>';
    return '<p>'+inline(L.join('<br>'))+'</p>';
  }).join('');
}
function titleHtml(t){const i=t.indexOf(':');return i>0?h(t.slice(0,i))+'<span class="sep">:</span>'+h(t.slice(i+1)):h(t)}
const TOOLBAR=id=>`<div class="toolbar"><button class="btn small" data-fmt="h" data-for="${id}">Заголовок</button><button class="btn small" data-fmt="b" data-for="${id}"><b>Жирный</b></button><button class="btn small" data-fmt="i" data-for="${id}"><i>Курсив</i></button><button class="btn small" data-fmt="li" data-for="${id}">• Список</button></div>`;

/* ---------------- render ---------------- */
function render(){
  const e=ui.edit;
  let o='';
  o+=`<header class="topbar gutter"><div class="col tb-row">
    <button class="brand" id="to-top" aria-label="Наверх">${SIGIL}<span class="brand-name">${h(S.hero.title)}</span></button>
    <nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${l}</button>`).join('')}</nav>
    <div class="tb-actions">${isMaster()
      ?`<button class="icon-btn ${e?'on':''}" id="edit-toggle" aria-pressed="${e}">${ICON_PEN}<span class="lbl">${e?'Редактирую':'Редактировать'}</span></button><button class="icon-btn" id="logout" aria-label="Выйти из режима мастера">${ICON_OUT}<span class="lbl">Выйти</span></button>`
      :`<button class="icon-btn" id="login-open" aria-label="Вход для мастера">${ICON_LOCK}<span class="lbl">Мастер</span></button>`}</div>
  </div></header>`;

  o+=`<section class="hero gutter">${MARK}<div class="col">`;
  if(e){
    o+=`<div class="field"><label for="f-eyebrow">Подзаголовок</label><input id="f-eyebrow" data-bind="hero.eyebrow" value="${h(S.hero.eyebrow)}"></div>
      <div class="field"><label for="f-title">Название игры</label><input id="f-title" data-bind="hero.title" value="${h(S.hero.title)}"></div>
      <div class="field"><label for="f-herotext">Описание игры</label>${TOOLBAR('f-herotext')}<textarea id="f-herotext" data-bind="hero.text" rows="5">${h(S.hero.text)}</textarea></div>`;
  }else{
    o+=`<div class="eyebrow">${h(S.hero.eyebrow)}</div><h1>${titleHtml(S.hero.title)}</h1>${S.hero.text?`<div class="lead">${md(S.hero.text)}</div>`:''}`;
  }
  o+='</div></section>';

  o+='<main class="col gutter">';
  if(e) o+=`<div class="edit-banner">Режим мастера. Правки увидят все после кнопки «Сохранить» внизу экрана.</div>`;
  if(ui.loading) o+='<p class="empty">Загружаю…</p>';
  else if(ui.loadErr) o+='<p class="empty">Не удалось загрузить данные. Проверьте интернет и обновите страницу.</p>';
  else o+= ui.tab==='about'?renderAbout():ui.tab==='lore'?renderLore():renderRoles();
  o+='</main>';
  o+=`<footer class="col gutter">«${h(S.hero.title)}» · ролевая игра живого действия</footer>`;

  if(e && (dirty()||ui.saving||ui.err)) o+=`<div class="savebar"><div class="in"><span class="msg">${ui.saving?'Сохраняю…':(ui.err||'Есть несохранённые изменения')}</span><button class="btn" id="discard" ${ui.saving?'disabled':''}>Отменить</button><button class="btn primary" id="save" ${ui.saving?'disabled':''}>Сохранить</button></div></div>`;
  if(ui.modal) o+=renderModal();
  if(ui.toast) o+=`<div class="toast" role="status">${h(ui.toast)}</div>`;

  const a=document.activeElement, aid=a&&a.id, sel=a&&('selectionStart' in a)?[a.selectionStart,a.selectionEnd]:null, y=window.scrollY;
  document.getElementById('root').innerHTML=o;
  if(aid){const el=document.getElementById(aid); if(el){el.focus({preventScroll:true}); if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}}
  if(Math.abs(window.scrollY-y)>2) window.scrollTo(0,y);
  measure();
}
function measure(){const tb=document.querySelector('.topbar'); if(tb) document.documentElement.style.setProperty('--tb',tb.offsetHeight+'px')}

function renderAbout(){
  if(ui.edit) return `<div class="field"><label for="f-about">Вкладка «Об игре»</label>${TOOLBAR('f-about')}<textarea id="f-about" data-bind="about" rows="18">${h(S.about)}</textarea><span class="hint">Пустая строка начинает новый абзац.</span></div>`;
  return `<div class="section-title"><h2>Об игре</h2></div><article class="prose">${md(S.about)||'<p class="empty">Скоро здесь появится информация об игре.</p>'}</article>`;
}

function renderLore(){
  if(!S.lore.find(x=>x.id===ui.lore)) ui.lore=S.lore[0]?.id||null;
  const a=S.lore.find(x=>x.id===ui.lore);
  let nav='<div class="cap">Статьи</div>'+S.lore.map((x,i)=>`<div class="lore-item"><button class="lore-link" data-lore="${x.id}" aria-current="${x.id===ui.lore}">${h(x.title)||'Без названия'}</button>${ui.edit?`<button class="mv" data-lmove="${i}" data-dir="-1" aria-label="Выше">▲</button><button class="mv" data-lmove="${i}" data-dir="1" aria-label="Ниже">▼</button>`:''}</div>`).join('');
  if(ui.edit) nav+=`<div class="lore-item"><button class="btn small gold" id="lore-add" style="margin:8px 12px">+ Статья</button></div>`;
  let body;
  if(!a) body=`<p class="empty">${ui.edit?'Нажмите «+ Статья», чтобы добавить первую.':'Статьи лора скоро появятся.'}</p>`;
  else if(ui.edit) body=`<div class="field"><label for="f-ltitle">Заголовок статьи</label><input id="f-ltitle" data-lbind="title" value="${h(a.title)}"></div>
    <div class="field"><label for="f-lbody">Текст статьи</label>${TOOLBAR('f-lbody')}<textarea id="f-lbody" data-lbind="body" rows="18">${h(a.body)}</textarea></div>
    <button class="btn danger" id="lore-del">${ui.confirmLore===a.id?'Нажмите ещё раз, чтобы удалить':'Удалить статью'}</button>`;
  else body=`<article class="lore-article prose"><h2>${h(a.title)}</h2>${md(a.body)}</article>`;
  return `<div class="lore"><nav class="lore-nav" aria-label="Статьи лора">${nav}</nav><div>${body}</div></div>`;
}

function plural(n,a,b,c){const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c}
function renderRoles(){
  const teams=S.teams;
  const total=S.roles.length, free=S.roles.filter(r=>!r.player).length;
  let o=`<div class="section-title"><h2>Сетка ролей</h2></div>`;
  if(total) o+=`<p class="hint" style="margin:-10px 0 18px">${total} ${plural(total,'роль','роли','ролей')}, свободно ${free}</p>`;
  if(teams.length>1) o+='<div class="filters">'+[['all','Все']].concat(teams.map(t=>[t.id,t.name])).map(([id,n])=>`<button class="chip" data-filter="${id}" aria-pressed="${ui.filter===id}">${h(n)}</button>`).join('')+'</div>';
  const shown=ui.filter==='all'?teams:teams.filter(t=>t.id===ui.filter);
  for(const t of shown){
    const rs=S.roles.filter(r=>r.team===t.id), fr=rs.filter(r=>!r.player).length;
    o+=`<section class="team"><div class="team-head"><h2>${h(t.name)}</h2><span class="team-count">${rs.length} ${plural(rs.length,'роль','роли','ролей')} · свободно ${fr}</span>${ui.edit?`<span class="actions"><button class="btn small" data-team-edit="${t.id}">Изменить</button></span>`:''}</div><div class="team-rule"></div>`;
    if(t.desc) o+=`<p class="team-desc">${h(t.desc)}</p>`;
    o+='<div class="grid">'+rs.map(renderCard).join('');
    if(ui.edit) o+=`<button class="add-card" data-role-add="${t.id}">+ Персонаж</button>`;
    o+='</div>';
    if(!rs.length&&!ui.edit) o+='<p class="empty">Роли скоро появятся.</p>';
    o+='</section>';
  }
  if(ui.edit) o+=`<button class="btn gold" id="team-add">+ Новая команда</button>`;
  else if(!teams.length) o+='<p class="empty">Сетка ролей пока пуста.</p>';
  return o;
}
function photoSrc(p){if(!p) return ''; if(p.startsWith('ph:')) return photos[p.slice(3)]||''; return p}
function renderCard(r){
  const src=photoSrc(r.photo);
  const ph=src?`<img src="${h(src)}" alt="${h(r.name)}" loading="lazy">`:`<span class="initial">${h((r.name||'?').trim()[0]||'?')}</span>`;
  const st=r.player?`<span class="status taken">Игрок: ${h(r.player)}</span>`:`<span class="status free">Свободна</span>`;
  const tools=ui.edit?`<div class="card-tools"><button class="btn small" data-role-edit="${r.id}">Изменить</button><button class="btn small" data-rmove="${r.id}" data-dir="-1" aria-label="Переместить левее">←</button><button class="btn small" data-rmove="${r.id}" data-dir="1" aria-label="Переместить правее">→</button></div>`:'';
  return `<article class="card"><div class="portrait">${ph}</div><div class="card-body"><h3>${h(r.name)}</h3>${r.title?`<div class="rtitle">${h(r.title)}</div>`:''}${r.text?`<p>${h(r.text)}</p>`:''}${st}</div>${tools}</article>`;
}

function renderModal(){
  const m=ui.modal, wrap=inner=>`<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">${inner}</div></div>`;
  if(m.kind==='login') return wrap(`<h2 id="m-h">Вход для мастера</h2>
    <form id="login-form"><div class="field"><label for="m-pin">Код мастера</label><input id="m-pin" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required></div>
    <p class="err" id="m-err">${h(m.err||'')}</p>
    <div class="foot"><span class="grow"></span><button type="button" class="btn" id="m-cancel">Отмена</button><button type="submit" class="btn primary" id="m-login">Войти</button></div></form>`);
  if(m.kind==='role'){
    const d=m.draft, src=photoSrc(d.photo);
    return wrap(`<h2 id="m-h">${m.isNew?'Новый персонаж':'Персонаж'}</h2>
    <div class="field"><span class="lbl">Фотография</span><div class="photo-pick"><div class="thumb">${src?`<img src="${h(src)}" alt="">`:''}</div>
      <div style="display:grid;gap:8px;min-width:0"><label class="btn small gold" for="m-photo" style="justify-self:start">${src?'Заменить фото':'Загрузить фото'}</label><input type="file" id="m-photo" accept="image/*" hidden>
      <span class="hint">${m.uploading?'Загружаю фото…':m.photoErr?h(m.photoErr):'JPG или PNG, уменьшится автоматически.'}</span>${src?'<button class="btn small" id="m-photo-clear" style="justify-self:start">Убрать фото</button>':''}</div></div></div>
    <div class="field"><label for="m-name">Имя персонажа</label><input id="m-name" data-d="name" value="${h(d.name)}"></div>
    <div class="field"><label for="m-title">Титул или должность</label><input id="m-title" data-d="title" value="${h(d.title)}"></div>
    <div class="field"><label for="m-text">Короткий текст</label><textarea id="m-text" data-d="text" rows="4">${h(d.text)}</textarea></div>
    <div class="field"><label for="m-team">Команда</label><select id="m-team" data-d="team">${S.teams.map(t=>`<option value="${t.id}" ${t.id===d.team?'selected':''}>${h(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-player">Игрок</label><input id="m-player" data-d="player" value="${h(d.player)}" placeholder="Пусто, если роль свободна"></div>
    <div class="foot">${m.isNew?'':`<button class="btn danger" id="m-del">${m.confirm?'Точно удалить?':'Удалить'}</button>`}<span class="grow"></span><button class="btn" id="m-cancel">Отмена</button><button class="btn primary" id="m-ok" ${m.uploading?'disabled':''}>Готово</button></div>`);
  }
  const d=m.draft, count=m.isNew?0:S.roles.filter(r=>r.team===d.id).length;
  return wrap(`<h2 id="m-h">${m.isNew?'Новая команда':'Команда'}</h2>
    <div class="field"><label for="m-tname">Название</label><input id="m-tname" data-d="name" value="${h(d.name)}" placeholder="Например, Дом Старков"></div>
    <div class="field"><label for="m-tdesc">Короткое описание</label><textarea id="m-tdesc" data-d="desc" rows="3">${h(d.desc)}</textarea></div>
    ${m.isNew?'':`<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn small" data-tmove="-1">Поднять выше</button><button class="btn small" data-tmove="1">Опустить ниже</button></div>`}
    <div class="foot">${m.isNew?'':`<button class="btn danger" id="m-del" ${count?'disabled':''}>${m.confirm?'Точно удалить?':'Удалить команду'}</button>`}<span class="grow"></span><button class="btn" id="m-cancel">Отмена</button><button class="btn primary" id="m-ok">Готово</button></div>
    ${count?`<p class="hint" style="margin-top:10px">Команду можно удалить, когда в ней не останется персонажей (сейчас ${count}).</p>`:''}`);
}

/* ---------------- events ---------------- */
function setPath(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
let t1=null;
function soft(){clearTimeout(t1);t1=setTimeout(()=>{const has=!!document.querySelector('.savebar');if(has!==(dirty()||ui.saving||!!ui.err))render()},150)}
function toast(msg){ui.toast=msg;render();setTimeout(()=>{ui.toast='';render()},2200)}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);if(t.dataset.bind==='hero.title'){const b=document.querySelector('.brand-name');if(b)b.textContent=t.value}soft()}
  else if(t.dataset.lbind){const a=S.lore.find(x=>x.id===ui.lore);if(a){a[t.dataset.lbind]=t.value;if(t.dataset.lbind==='title'){const l=document.querySelector(`[data-lore="${a.id}"]`);if(l)l.textContent=t.value||'Без названия'}soft()}}
  else if(t.dataset.d&&ui.modal){ui.modal.draft[t.dataset.d]=t.value}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.d&&ui.modal) ui.modal.draft[t.dataset.d]=t.value;
  if(t.id==='m-photo'&&t.files&&t.files[0]) handlePhoto(t.files[0]);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal){ui.modal=null;render()}});

function applyFmt(id,kind){
  const ta=document.getElementById(id); if(!ta) return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  let ins,cs,ce;
  if(kind==='b'||kind==='i'){const w=kind==='b'?'**':'*';ins=w+(sel||'текст')+w;cs=s+w.length;ce=cs+(sel||'текст').length}
  else{const ls=v.lastIndexOf('\n',s-1)+1;const pre=kind==='h'?'## ':'- ';const block=v.slice(ls,e)||'';const lines=(block||'').split('\n').map(l=>pre+l.replace(/^(## |- )/,''));
    const rep=lines.join('\n');ta.setRangeText(rep,ls,e,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();return}
  ta.setRangeText(ins,s,e,'end');ta.setSelectionRange(cs,ce);ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button, .modal-bg'); if(!t) return;
  if(t.id==='modal-bg'){if(ev.target===t){ui.modal=null;render()}return}
  const ds=t.dataset;
  if(ds.tab){ui.tab=ds.tab;try{history.replaceState(null,'','#'+ds.tab)}catch(_){} render();const hero=document.querySelector('.hero');if(hero&&window.scrollY>hero.offsetHeight)window.scrollTo({top:hero.offsetTop+hero.offsetHeight-document.querySelector('.topbar').offsetHeight,behavior:'smooth'});return}
  if(t.id==='to-top'){window.scrollTo({top:0,behavior:'smooth'});return}
  if(ds.fmt){applyFmt(ds.for,ds.fmt);return}
  if(t.id==='login-open'){ui.modal={kind:'login'};render();document.getElementById('m-pin')?.focus();return}
  if(t.id==='logout'){if(dirty()&&!ui.confirmLogout){ui.confirmLogout=true;ui.err='Есть несохранённые изменения. Нажмите «Выйти» ещё раз, чтобы выйти без сохранения.';render();return}
    pin=null;try{sessionStorage.removeItem('vpv-pin')}catch(_){} ui.edit=false;ui.err='';ui.confirmLogout=false;S=JSON.parse(saved);render();return}
  if(t.id==='edit-toggle'){ui.edit=!ui.edit;ui.confirmLore=null;render();return}
  if(ds.lore){ui.lore=ds.lore;ui.confirmLore=null;render();if(window.innerWidth<=820){const n=document.querySelector('.lore');if(n&&n.getBoundingClientRect().top<0)window.scrollTo({top:window.scrollY+n.getBoundingClientRect().top-document.querySelector('.topbar').offsetHeight,behavior:'smooth'})}return}
  if(ds.filter){ui.filter=ds.filter;render();return}
  if(t.id==='lore-add'){const a={id:uid('l'),title:'Новая статья',body:''};S.lore.push(a);ui.lore=a.id;render();document.getElementById('f-ltitle')?.select();return}
  if(t.id==='lore-del'){if(ui.confirmLore===ui.lore){S.lore=S.lore.filter(x=>x.id!==ui.lore);ui.lore=null;ui.confirmLore=null}else ui.confirmLore=ui.lore;render();return}
  if(ds.lmove!==undefined){move(S.lore,+ds.lmove,+ds.dir);render();return}
  if(ds.rmove){const team=S.roles.find(r=>r.id===ds.rmove).team;const idx=S.roles.map((r,i)=>r.team===team?i:-1).filter(i=>i>=0);const pos=idx.indexOf(S.roles.findIndex(r=>r.id===ds.rmove));const to=pos+(+ds.dir);if(to>=0&&to<idx.length){const a=idx[pos],b=idx[to];[S.roles[a],S.roles[b]]=[S.roles[b],S.roles[a]]}render();return}
  if(ds.roleAdd){ui.modal={kind:'role',isNew:true,draft:{id:uid('r'),team:ds.roleAdd,name:'',title:'',text:'',player:'',photo:''}};render();document.getElementById('m-name')?.focus();return}
  if(ds.roleEdit){ui.modal={kind:'role',isNew:false,draft:{...S.roles.find(x=>x.id===ds.roleEdit)}};render();return}
  if(ds.teamEdit){ui.modal={kind:'team',isNew:false,draft:{...S.teams.find(x=>x.id===ds.teamEdit)}};render();return}
  if(t.id==='team-add'){ui.modal={kind:'team',isNew:true,draft:{id:uid('t'),name:'',desc:''}};render();document.getElementById('m-tname')?.focus();return}
  if(ds.tmove){const i=S.teams.findIndex(x=>x.id===ui.modal.draft.id);move(S.teams,i,+ds.tmove);render();return}
  if(t.id==='m-cancel'){ui.modal=null;render();return}
  if(t.id==='m-photo-clear'){ui.modal.draft.photo='';render();return}
  if(t.id==='m-del'){
    if(!ui.modal.confirm){ui.modal.confirm=true;render();return}
    const id=ui.modal.draft.id;
    if(ui.modal.kind==='role')S.roles=S.roles.filter(r=>r.id!==id);else{S.teams=S.teams.filter(x=>x.id!==id);if(ui.filter===id)ui.filter='all'}
    ui.modal=null;render();return}
  if(t.id==='m-ok'){
    const {kind,isNew,draft}=ui.modal;
    if(!draft.name.trim()){const f=document.getElementById(kind==='role'?'m-name':'m-tname');f.focus();f.placeholder='Введите название';return}
    const list=kind==='role'?S.roles:S.teams;
    if(isNew)list.push(draft);else list[list.findIndex(x=>x.id===draft.id)]=draft;
    ui.modal=null;render();return}
  if(t.id==='discard'){S=JSON.parse(saved);ui.err='';render();return}
  if(t.id==='save'){save();return}
});
function move(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function rpcErr(error){const m=(error&&error.message)||'';if(/too_many_attempts/.test(m))return 'Слишком много неверных попыток. Подождите 15 минут.';if(error&&(error.code==='PGRST202'||/Could not find the function/i.test(m)))return 'Вход по коду ещё не настроен в базе.';return 'Нет связи с сервером. Попробуйте ещё раз.'}

document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='login-form')return; ev.preventDefault();
  const val=document.getElementById('m-pin').value.trim(), err=document.getElementById('m-err'), btn=document.getElementById('m-login');
  btn.disabled=true; err.textContent='Проверяю…';
  const {data,error}=await sb.rpc('check_master_pin',{p_pin:val});
  btn.disabled=false;
  if(error){err.textContent=rpcErr(error);return}
  if(!data){err.textContent='Неверный код.';document.getElementById('m-pin').select();return}
  pin=val;try{sessionStorage.setItem('vpv-pin',val)}catch(_){}
  ui.modal=null;ui.edit=true;toast('Вы вошли как мастер');
});

/* ---------------- photos ---------------- */
async function handlePhoto(file){
  if(!ui.modal)return;
  ui.modal.uploading=true;ui.modal.photoErr='';render();
  try{
    const dataUrl=await shrink(file,520);
    const id=uid('p');
    const {data,error}=await sb.rpc('save_role_photo',{p_pin:pin,p_id:id,p_data:dataUrl});
    if(error)throw new Error(rpcErr(error));
    if(!data)throw new Error('Код мастера больше не подходит. Войдите заново.');
    photos[id]=dataUrl;
    if(ui.modal)ui.modal.draft.photo='ph:'+id;
  }catch(e){if(ui.modal)ui.modal.photoErr=e.message||'Не получилось загрузить фото. Попробуйте JPG или PNG.'}
  if(ui.modal){ui.modal.uploading=false;render()}
}
function shrink(file,max){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не получилось прочитать файл. Попробуйте JPG или PNG.'))};
    img.src=url;
  });
}

/* ---------------- save ---------------- */
async function save(){
  ui.saving=true;ui.err='';render();
  const {data,error}=await sb.rpc('save_site_content',{p_pin:pin,p_data:S});
  if(error){ui.err='Не сохранилось: '+rpcErr(error)}
  else if(!data){ui.err='Код мастера больше не подходит. Выйдите и войдите заново.'}
  else{
    saved=JSON.stringify(S);
    const keep=S.roles.map(r=>r.photo||'').filter(p=>p.startsWith('ph:')).map(p=>p.slice(3));
    sb.rpc('delete_role_photos',{p_pin:pin,p_keep:keep});
    ui.saving=false;toast('Сохранено');return;
  }
  ui.saving=false;render();
}
window.addEventListener('beforeunload',ev=>{if(isMaster()&&dirty()){ev.preventDefault();ev.returnValue=''}});
window.addEventListener('resize',measure);

/* ---------------- boot ---------------- */
const hash=(location.hash||'').slice(1);
if(TABS.some(([k])=>k===hash))ui.tab=hash;
render();
sb.from('site_content').select('data').eq('id',1).maybeSingle().then(({data,error})=>{
  if(error){ui.loadErr=true}
  else if(data&&data.data){S=Object.assign({hero:{eyebrow:'',title:'',text:''},about:'',lore:[],teams:[],roles:[]},data.data);saved=JSON.stringify(S)}
  ui.loading=false;render();
  const ids=S.roles.map(r=>r.photo||'').filter(p=>p.startsWith('ph:')).map(p=>p.slice(3));
  if(ids.length) sb.from('role_photos').select('id,data').in('id',ids).then(({data})=>{(data||[]).forEach(p=>photos[p.id]=p.data);render()});
});
})();
