<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Игра Престолов: Вой по волку</title>
<meta name="description" content="Ролевая игра живого действия «Игра Престолов: Вой по волку»: об игре, лор и сетка ролей.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: sticky iron topbar (sigil + title + tabs) over a torch-lit hero; content column below.
   Lore = sticky index + reading pane; roles = house sections with framed portrait cards. */
:root{
  --bg:#0d0e11; --bg-2:#121318; --surface:#17181e; --raised:#1f2027; --line:#2a2b33;
  --gold:#c9a65e; --gold-hi:#e3c482; --gold-line:rgba(201,166,94,.32);
  --crimson:#8f2b24; --crimson-hi:#ab372e;
  --fg:#ebe4d4; --muted:#9b9485; --ok:#8aac77;
  --display:"Forum","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --tb:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tb) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(13,14,17,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold-line)}
.tb-row{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{flex:none;width:26px;height:30px}
.brand-name{font-family:var(--display);font-size:21px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{position:relative;background:none;border:0;padding:18px 14px;cursor:pointer;color:var(--muted);
  font-family:var(--display);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--gold)}
.tb-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.icon-btn:hover{color:var(--fg);border-color:var(--gold-line)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--gold-line);
  background:
    radial-gradient(90% 120% at 15% 0%, rgba(143,43,36,.28), transparent 60%),
    radial-gradient(70% 90% at 100% 100%, rgba(201,166,94,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg))}
.hero .col{padding-block:56px 48px;display:grid;gap:18px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,var(--gold),transparent)}
.hero h1{font-size:clamp(38px,7.4vw,82px);color:var(--fg);letter-spacing:.015em}
.hero h1 .sep{color:var(--gold)}
.lead{max-width:64ch;font-size:18px;color:#d8d0bf}
.lead p{margin:0 0 .8em}.lead p:last-child{margin:0}
.hero-mark{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:min(42vw,420px);opacity:.07;pointer-events:none}

/* page */
main.col{padding-block:36px 140px}
.section-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-title h2{font-size:clamp(28px,4vw,38px)}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.prose{max-width:68ch}
.prose h3{font-size:30px;margin:1.5em 0 .45em;color:var(--gold-hi)}
.prose h4{font-size:23px;margin:1.3em 0 .35em}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1.1em;padding-left:0;list-style:none}
.prose li{position:relative;padding-left:22px;margin-bottom:.4em}
.prose li::before{content:"";position:absolute;left:4px;top:.68em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prose strong{color:#fff3dc;font-weight:600}
.empty{color:var(--muted);font-style:italic}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:6px;
  padding:9px 16px;font-size:15px;cursor:pointer;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.primary:hover{background:var(--crimson-hi)}
.btn.gold{background:transparent;border-color:var(--gold-line);color:var(--gold-hi)}
.btn.danger{color:#eaa497;border-color:rgba(171,55,46,.6);background:transparent}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:grid;gap:5px;margin-bottom:16px}
.field label,.field .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-line);outline:none}
.field textarea{line-height:1.6;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.field label.btn{text-transform:none;letter-spacing:normal;font-size:13px;color:var(--gold-hi)}
.edit-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--gold-line);background:rgba(201,166,94,.06);
  border-radius:8px;padding:10px 14px;font-size:14px;color:#d9cfb9;margin-bottom:24px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* lore */
.lore{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:2px;max-height:calc(100vh - var(--tb) - 60px);overflow:auto;padding-right:4px}
.lore-nav .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.lore-item{display:flex;align-items:center}
.lore-link{flex:1;min-width:0;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1.3}
.lore-link:hover{color:var(--fg);background:var(--surface)}
.lore-link[aria-current="true"]{color:var(--gold-hi);background:var(--surface)}
.mv{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:11px}
.lore-article h2{font-size:clamp(32px,5vw,46px);margin-bottom:18px}

/* roles */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:30px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.team{margin-bottom:52px}
.team-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.team-head h2{font-size:clamp(28px,4vw,36px)}
.team-count{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums;padding-bottom:5px}
.team-head .actions{margin-left:auto}
.team-rule{height:1px;background:linear-gradient(90deg,var(--gold-line),transparent);margin-bottom:12px}
.team-desc{color:var(--muted);margin:0 0 20px;max-width:68ch;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold-line)}
.portrait{position:relative;aspect-ratio:3/4;max-width:100%;background:radial-gradient(80% 60% at 50% 35%,#24252d,#121318);display:grid;place-items:center;overflow:hidden}
.portrait::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,94,.22);border-radius:3px;pointer-events:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .initial{font-family:var(--display);font-size:84px;color:rgba(201,166,94,.28)}
.card-body{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.card h3{font-size:24px;line-height:1.05}
.rtitle{font-size:14px;color:var(--gold);font-style:italic}
.card p{margin:2px 0 0;font-size:15px;line-height:1.5;color:#d6cebd}
.status{justify-self:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-top:6px}
.status.free{color:var(--ok);border:1px solid rgba(138,172,119,.45)}
.status.taken{color:var(--muted);border:1px solid var(--line)}
.contact{display:flex;gap:6px;align-items:center;font-size:14px;margin-top:2px;min-width:0}
.contact svg{flex:none;width:14px;height:14px;color:var(--muted)}
.contact a,.contact span.c{flex:1 1 auto;color:#b9cad8;overflow-wrap:anywhere;text-decoration:none;min-width:0;line-height:1.35}
.contact a{text-decoration:underline dotted rgba(147,170,187,.6);text-underline-offset:3px}
.contact a:hover{color:#dfe7ee}
.copy-btn{flex:none;display:grid;place-items:center;width:26px;height:26px;background:none;border:1px solid var(--line);border-radius:5px;color:var(--muted);cursor:pointer;padding:0}
.copy-btn svg{width:13px;height:13px}
.copy-btn:hover{color:var(--fg);border-color:var(--gold-line)}
.card-tools{display:flex;gap:6px;padding:0 16px 14px}
.add-card{border:1px dashed var(--gold-line);border-radius:8px;background:rgba(201,166,94,.03);color:var(--gold);cursor:pointer;min-height:200px;font-size:16px;font-family:var(--display);letter-spacing:.05em}
.add-card:hover{background:rgba(201,166,94,.07)}

/* save bar, modal, toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(31,32,39,.97);border-top:1px solid var(--gold-line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:160px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border:1px solid var(--gold-line);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px}
.modal h2{font-size:30px;margin-bottom:18px}
.modal .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal .foot .grow{flex:1}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .thumb{width:84px;aspect-ratio:3/4;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;flex:none}
.photo-pick .thumb img{width:100%;height:100%;object-fit:cover}
.pin-input{text-align:center;font-family:var(--display);font-size:34px!important;letter-spacing:.5em;padding-left:calc(12px + .5em)!important}
.err{color:#eaa497;font-size:14px;min-height:1.3em;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--gold);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
footer.col{padding-block:0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}

/* mobile */
@media (max-width:820px){
  .tb-row{flex-wrap:wrap;gap:0;min-height:0}
  .brand{flex:1;padding:10px 0}
  .brand-name{font-size:19px}
  .tabs{order:3;width:100%;margin:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid var(--line)}
  .tab{padding:11px 4px;font-size:16px;text-align:center}
  .tab[aria-selected="true"]::after{left:18%;right:18%}
  .tabs[style*="--n:5"] .tab{font-size:14px;padding:11px 1px;letter-spacing:.02em}
  .icon-btn .lbl{display:none}
  .icon-btn{padding:8px}
  .hero .col{padding-block:36px 32px}
  .lead{font-size:16.5px}
  .hero-mark{width:60vw;right:-60px;opacity:.06}
  main.col{padding-block:26px 130px}
  .lore{grid-template-columns:1fr;gap:18px}
  .lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:6px;overflow-x:auto;max-height:none;padding:10px 0;margin:0 -16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .lore-nav::-webkit-scrollbar{display:none}
  .lore-nav .cap{display:none}
  .lore-item{flex:none}
  .lore-link{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
  .lore-link[aria-current="true"]{border-color:var(--gold);background:transparent}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-body{padding:10px 12px 12px}
  .card h3{font-size:20px}
  .card p{font-size:14px}
  .card-tools{padding:0 12px 12px;flex-wrap:wrap}
  .add-card{min-height:160px}
  .modal-bg{place-items:end center;padding:0}
  .modal{width:100%;border-radius:16px 16px 0 0;max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}

/* lore covers + page background */
#page-bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity .5s;pointer-events:none}
#page-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,14,17,.45) 0%,rgba(13,14,17,.76) 45%,rgba(13,14,17,.9) 100%)}
#page-bg.on{opacity:1}
body.has-bg main.col,body.has-bg footer.col{background:transparent}
.lore-cover{position:relative;aspect-ratio:16/7;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--gold-line);margin-bottom:22px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.lore-cover img{width:100%;height:100%;object-fit:cover;display:block}
.lore-cover::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,94,.25);border-radius:5px;pointer-events:none}
.cover-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cover-pick .thumb{width:180px;aspect-ratio:16/7;border-radius:6px;overflow:hidden;border:1px dashed var(--gold-line);background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none}
.cover-pick .thumb img{width:100%;height:100%;object-fit:cover}
.hovercard.lore .hc-ph img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.lore-cover{aspect-ratio:16/9;border-radius:8px}.cover-pick .thumb{width:100%}}

/* lore/rules search */
.lore-side{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:6px;min-width:0}
.lore-side .lore-nav{position:static;max-height:calc(100vh - var(--tb) - 130px)}
.nav-head{display:flex;align-items:center;gap:10px;padding:0 4px 4px 12px}
.nav-head .cap{padding:0;flex:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lore-search{flex:1;min-width:0;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--fg)}
.lore-search:focus{border-color:var(--gold-line);outline:none}
.lore-snip{display:block;font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:3px}
.lore-snip mark,.lore-link mark{background:rgba(201,166,94,.28);color:var(--fg);border-radius:2px;padding:0 1px}
@media (max-width:820px){
  .lore-side{top:calc(var(--tb) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px 0;border-bottom:1px solid var(--line);gap:0}
  .nav-head{padding:0}
  .nav-head .cap{display:none}
  .lore-search{font-size:16px;padding:7px 14px}
  .lore-side .lore-nav{position:static;margin:0;padding:10px 0;border-bottom:0;background:none}
  .lore-snip{display:none}
}

/* team icons */
.team-icon{width:46px;height:46px;object-fit:contain;flex:none;align-self:center;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.team-head h2{display:flex;align-items:center;gap:12px}
.chip .ci{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}
.lg-cap .ci{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:6px}
.icon-pick{display:flex;gap:14px;align-items:center}
.icon-pick .thumb{width:64px;height:64px;border-radius:8px;border:1px dashed var(--gold-line);display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:11px;flex:none;overflow:hidden}
.icon-pick .thumb img{width:100%;height:100%;object-fit:contain}
@media (max-width:820px){.team-icon{width:38px;height:38px}}

/* shared floating controls & cards */
.mc-name{font-family:var(--display);font-size:23px;line-height:1.1}
.ms-in{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:15px;color:var(--fg);min-width:0}
.map-zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:5}
.mz{width:38px;height:38px;border-radius:8px;background:rgba(13,14,17,.86);border:1px solid var(--gold-line);color:var(--fg);font-size:19px;cursor:pointer;line-height:1}
.mz:hover{background:rgba(31,32,39,.95)}
.map-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}

/* legend tabs */
.lg-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px;border-bottom:1px solid var(--line)}
.lg-tab{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;padding:7px 12px;margin-bottom:-1px;font-size:14px;color:var(--muted);cursor:pointer}
.lg-tab:hover{color:var(--fg)}
.lg-tab[aria-selected="true"]{color:var(--gold-hi);background:var(--surface);border-color:var(--line)}
.lg-tab.hid{font-style:italic}
.lg-tab.add{color:var(--gold);margin-left:auto}
.lg-tabbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lg-tabbar .ms-in{flex:1;min-width:160px}
@media (max-width:820px){.lg-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.lg-tabs::-webkit-scrollbar{display:none}.lg-tab{flex:none}.lg-tab.add{margin-left:0}}

/* legend images & backgrounds */
.lg-editor img.img-s{width:30%}.lg-editor img.img-m{width:48%}.lg-editor img.img-l{width:75%}.lg-editor img.img-f{width:100%}
.lg-editor img.al-c{margin-left:auto;margin-right:auto}
.lg-editor img.al-l{float:left;margin:6px 20px 10px 0}
.lg-editor img.al-r{float:right;margin:6px 0 10px 20px}

function inline(s){return s.replace(REF_RE,(m,k,id,lab)=>refHtml(k,id,lab)).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^\w"=])\*([^*<>]+?)\*/g,'$1<em>$2</em>')}
function md(text){
  return h(text||'').split(/\n\s*\n/).map(b=>{

}

function SEC(){return ui.tab==='rules'
  ?{k:'rules',c:'rule',pre:'u',cap:'Разделы',add:'+ Раздел',item:'раздела',newT:'Новый раздел',del:'Удалить раздел',empty:'Правила скоро появятся.',emptyEdit:'Нажмите «+ Раздел», чтобы добавить первый.',title:'Правила'}
  :{k:'lore',c:'lore',pre:'l',cap:'Статьи',add:'+ Статья',item:'статьи',newT:'Новая статья',del:'Удалить статью',empty:'Статьи лора скоро появятся.',emptyEdit:'Нажмите «+ Статья», чтобы добавить первую.',title:'Лор игры'}}
function renderLore(){
  const X=SEC(), L=S[X.k]=S[X.k]||[];
  if(!L.find(x=>x.id===ui[X.c])) ui[X.c]=L[0]?.id||null;
  const a=L.find(x=>x.id===ui[X.c]);
  const q=((ui.lsq||{})[X.k]||'').trim().toLowerCase();
  const hits=L.map((x,i)=>{ if(!q) return {x,i};
    const t=(x.title||'').toLowerCase(); if(t.includes(q)) return {x,i};
    const plain=loreExcerpt(x.body,1e9), k=plain.toLowerCase().indexOf(q); if(k<0) return null;
    const a0=Math.max(0,k-28), snip=(a0?'…':'')+plain.slice(a0,k+q.length+40)+(k+q.length+40<plain.length?'…':'');
    return {x,i,snip,k:k-a0+(a0?1:0)}; }).filter(Boolean);
  const mark=(str,k)=>h(str.slice(0,k))+'<mark>'+h(str.slice(k,k+q.length))+'</mark>'+h(str.slice(k+q.length));

function plural(n,a,b,c){const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c}
function renderRoles(){
  const teams=S.teams;

  if(teams.length>1) o+='<div class="filters">'+[['all','Все','']].concat(teams.map(t=>[t.id,t.name,photoSrc(t.icon)])).map(([id,n,ic])=>`<button class="chip" data-filter="${id}" aria-pressed="${ui.filter===id}">${ic?`<img class="ci" src="${h(ic)}" alt="">`:''}${h(n)}</button>`).join('')+'</div>';
  const shown=ui.filter==='all'?teams:teams.filter(t=>t.id===ui.filter);
  for(const t of shown){
    const rs=S.roles.filter(r=>r.team===t.id), fr=rs.filter(r=>!r.player).length;

    o+='</section>';
  }
  if(ui.edit) o+=`<button class="btn gold" id="team-add">+ Новая команда</button>`;
  else if(!teams.length) o+='<p class="empty">Сетка ролей пока пуста.</p>';

}
function photoSrc(p){if(!p) return ''; if(p.startsWith('ph:')) return photos[p.slice(3)]||''; return p}
const ICON_MSG=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>`;
function contactHref(c){
  if(/^https?:\/\/\S+$/i.test(c)) return c;
  if(/^(t\.me|telegram\.me|vk\.com|vk\.ru|wa\.me|instagram\.com|discord\.gg)\/\S+$/i.test(c)) return 'https://'+c;
  if(/^@[A-Za-z0-9_]{4,32}$/.test(c)) return 'https://t.me/'+c.slice(1);
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return 'mailto:'+c;
  if(/^\+?[\d\s()-]{7,}$/.test(c)) return 'tel:'+c.replace(/[^\d+]/g,'');
  return '';
}
function contactHtml(c){
  const href=contactHref(c);
  const label=href?`<a href="${h(href)}" target="_blank" rel="noopener noreferrer">${h(c)}</a>`:`<span class="c">${h(c)}</span>`;
  return `<div class="contact">${ICON_MSG}${label}<button class="copy-btn" data-copy="${h(c)}" aria-label="Скопировать контакт" title="Скопировать"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5H5"/></svg></button></div>`;
}
function renderCard(r){
  const src=photoSrc(r.photo);
  const ph=src?`<img src="${h(src)}" alt="${h(r.name)}" loading="lazy">`:`<span class="initial">${h((r.name||'?').trim()[0]||'?')}</span>`;
  const st=r.player?`<span class="status taken">Игрок: ${h(r.player)}</span>`:`<span class="status free">Свободна</span>`;
  const tools=ui.edit?`<div class="card-tools"><button class="btn small" data-role-edit="${r.id}">Изменить</button><button class="btn small" data-lg="${r.id}">Легенда (мастер)</button><button class="btn small" data-rmove="${r.id}" data-dir="-1" aria-label="Переместить левее">←</button><button class="btn small" data-rmove="${r.id}" data-dir="1" aria-label="Переместить правее">→</button></div>`:pin?`<div class="card-tools"><button class="btn small gold" data-lg="${r.id}">Легенда (мастер)</button></div>`:PINNED.has(r.id)?`<div class="card-tools"><button class="btn small gold" data-plg="${r.id}">Посмотреть легенду</button></div>`:'';
  return `<article class="card"><div class="portrait">${ph}</div><div class="card-body"><h3>${h(r.name)}</h3>${r.title?`<div class="rtitle">${h(r.title)}</div>`:''}${r.text?`<p>${h(r.text)}</p>`:''}${st}${r.contact&&r.contact.trim()?contactHtml(r.contact.trim()):''}</div>${tools}</article>`;
}

/* ---------------- events ---------------- */
function setPath(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
let t1=null;
function soft(){clearTimeout(t1);t1=setTimeout(()=>{const has=!!document.querySelector('.savebar');if(has!==(dirty()||ui.saving||!!ui.err))render()},150)}
function toast(msg){ui.toast=msg;render();setTimeout(()=>{ui.toast='';render()},2200)}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='lg-editor'){scheduleLegendSave();return}
  if(t.id==='lg-search'){ui.lgq=t.value;render();return}
  if(t.id==='gr-q'){ui.grQ=t.value;render();return}
  if(t.id==='gr-name'){const g=grCur();g.name=t.value;const b=document.querySelector(`[data-grg="${g.id}"]`);if(b)b.textContent=t.value||'Без названия';grSave();return}
  if(t.id==='pwc-name'&&ui.modal){ui.modal.draft.name=t.value;return}
  if(['pw-army','pw-fleet','pw-gold','pw-note'].includes(t.id)&&ui.modal){ui.modal.draft[t.id.slice(3)]=t.id==='pw-note'?t.value:pwNum(t.value);return}
  if(/^gr-goal-/.test(t.id)){const n=grCur().nodes.find(x=>ui.grSel&&x.id===ui.grSel.id);if(n){const k={'gr-goal-pub':'pub','gr-goal-per':'per','gr-goal-sec':'sec','gr-goal-fear':'fear'}[t.id];GR.chars=GR.chars||{};const c=GR.chars[n.ref]=GR.chars[n.ref]||{};c[k]=t.value.slice(0,1500);grSave()}return}
  if(t.id==='gr-note'){const e=grCur().edges.find(x=>ui.grSel&&x.id===ui.grSel.id);if(e){e.note=t.value;grRedrawEdges();grSave()}return}
  if(t.id==='m-gtname'){ui.modal.draft.name=t.value;return}
  if(t.id==='lg-bg-dim'){const p=lgPage(lgDoc(ui.legend),curLgTab(ui.legend));if(p&&p.bg){p.bg.dim=(+t.value)/100;applyEdBg();lgDirtyId=ui.legend;setStatus('Есть изменения…');clearTimeout(lgTimer);lgTimer=setTimeout(()=>{lgTimer=null;saveLegend()},900)}return}
  if(t.id==='lg-tab-title'){const L=lgDoc(ui.legend),x=L.tabs.find(y=>y.id===ui.lgTab);if(x){x.title=t.value;const b=document.querySelector(`.lg-tab[data-lgtab="${ui.lgTab}"]`);if(b)b.lastChild.textContent=t.value||'Без названия';lgDirtyId=ui.legend;setStatus('Есть изменения…');clearTimeout(lgTimer);lgTimer=setTimeout(()=>{lgTimer=null;saveLegend()},1200)}return}
  if(t.id==='lore-search'){(ui.lsq=ui.lsq||{})[SEC().k]=t.value;render();return}
  if(t.id==='m-rq'||t.id==='m-lq'){ui.modal.q=t.value;render();return}
  if(t.id==='lg-pin-in'){t.value=t.value.replace(/\D/g,'');(ui.pinDraft=ui.pinDraft||{})[ui.legend]=t.value;return}
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);if(t.dataset.bind==='hero.title'){const b=document.querySelector('.brand-name');if(b)b.textContent=t.value}soft()}
  else if(t.dataset.lbind){const a=(S[SEC().k]||[]).find(x=>x.id===ui[SEC().c]);if(a){a[t.dataset.lbind]=t.value;if(t.dataset.lbind==='title'){const l=document.querySelector(`[data-lore="${a.id}"]`);if(l)l.textContent=t.value||'Без названия'}soft()}}
  else if(t.dataset.d&&ui.modal){ui.modal.draft[t.dataset.d]=t.value}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.d&&ui.modal) ui.modal.draft[t.dataset.d]=t.value;
  if(t.id==='m-photo'&&t.files&&t.files[0]) handlePhoto(t.files[0]);
  if(t.id==='m-ticon'&&t.files&&t.files[0]) handlePhoto(t.files[0],'icon');
  if(t.id==='lg-select') goLegend(t.value);
  if(t.id==='pw-img'&&t.files&&t.files[0]){const f=t.files[0];t.value='';pwUpload(f)}
  if(t.id==='pw-ref'&&ui.modal)ui.modal.draft.ref=t.value;
  if(t.dataset.pwsel){const sl=ui.pwSel=ui.pwSel||new Set();t.checked?sl.add(t.dataset.pwsel):sl.delete(t.dataset.pwsel);render()}
  if(t.dataset.pwmem&&ui.modal){const d=ui.modal.draft;d.members=d.members.filter(x=>x!==t.dataset.pwmem);if(t.checked)d.members.push(t.dataset.pwmem);render()}
  if(['gr-e-secret','gr-e-conflict','gr-e-dep','gr-e-trust'].includes(t.id)){const e=grCur().edges.find(x=>ui.grSel&&x.id===ui.grSel.id);if(e){if(t.id==='gr-e-secret')e.secret=t.checked;if(t.id==='gr-e-conflict')e.conflict=t.checked;if(t.id==='gr-e-dep')e.dep=t.value;if(t.id==='gr-e-trust')e.trust=t.value;grSave();render()}}
  if(['gr-cfg-low','gr-cfg-closed','gr-cfg-broker'].includes(t.id)){GR.cfg=GR.cfg||{};const k=t.id.slice(7);const v=parseInt(t.value,10);if(v>0||(k==='low'&&v===0))GR.cfg[k]=v;else delete GR.cfg[k];grSave();render()}
  if(t.id==='gr-etype'){const e=grCur().edges.find(x=>ui.grSel&&x.id===ui.grSel.id);if(e){e.type=t.value;grSave();render()}}
  if(t.id==='m-gtdir'&&ui.modal) ui.modal.draft.dir=t.checked;
  if(t.id==='lg-bg-file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';setStatus('Загружаю фон…');
    shrink(f,1600).then(d=>legendMeta(L=>{const p=lgPage(L,curLgTab(ui.legend));if(p){const o=safeBg(p.bg);p.bg={src:d,dim:o?o.dim:.55,mode:o?o.mode:'cover'}}}),e=>setStatus(e.message||'Не получилось прочитать картинку.'))}
  if(t.dataset.brand&&t.files&&t.files[0]){const f=t.files[0],k=t.dataset.brand;t.value='';uploadBrand(k,f)}
  if(t.id==='lore-cover-file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';uploadCover(f)}
  if(t.id==='lg-photo'&&t.files&&t.files[0]){const f=t.files[0];t.value='';insertPhoto(f)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(ui.modal){ui.modal=null;render()}else if(ui.tab==='graphs'&&(ui.grType||ui.grFrom||ui.grSel)){ui.grType=null;ui.grFrom=null;ui.grSel=null;render()}}
  else if((ev.key==='Delete'||ev.key==='Backspace')&&ui.tab==='graphs'&&ui.grSel&&!ui.modal&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&!(document.activeElement&&document.activeElement.isContentEditable)){
    ev.preventDefault();const g=grCur();if(ui.grSel.k==='e')g.edges=g.edges.filter(e=>e.id!==ui.grSel.id);else{const id=ui.grSel.id;g.nodes=g.nodes.filter(n=>n.id!==id);g.edges=g.edges.filter(e=>e.from!==id&&e.to!==id)}ui.grSel=null;grSave();render()}});

function applyFmt(id,kind){
  const ta=document.getElementById(id); if(!ta) return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  let ins,cs,ce;
  if(kind==='b'||kind==='i'){const w=kind==='b'?'**':'*';ins=w+(sel||'текст')+w;cs=s+w.length;ce=cs+(sel||'текст').length}
  else{const ls=v.lastIndexOf('\n',s-1)+1;const pre=kind==='h'?'## ':'- ';const block=v.slice(ls,e)||'';const lines=(block||'').split('\n').map(l=>pre+l.replace(/^(## |- )/,''));
    const rep=lines.join('\n');ta.setRangeText(rep,ls,e,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();return}
  ta.setRangeText(ins,s,e,'end');ta.setSelectionRange(cs,ce);ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();
}

document.addEventListener('click',async ev=>{
  const rl=ev.target.closest('.role-link'); if(rl){ev.preventDefault();goLegend(rl.dataset.role);return}
  const lr=ev.target.closest('.lore-ref'); if(lr){ev.preventDefault();goLore(lr.dataset.loreref);return}
  const t=ev.target.closest('button, .modal-bg'); if(!t) return;
  if(t.id==='modal-bg'){if(ev.target===t){ui.modal=null;render()}return}
  const ds=t.dataset;
  if(ds.copy!==undefined){const v=ds.copy;const done=()=>toast('Контакт скопирован');
    try{navigator.clipboard.writeText(v).then(done,()=>{fallbackCopy(v);done()})}catch(_){fallbackCopy(v);done()}return}
  if(ds.lgtab){flushLegend();ui.lgTab=ds.lgtab;ui.confirmTabDel=null;render();return}
  if(t.id==='lg-tab-add'){const nt={id:uid('t'),title:'Новая вкладка',html:'',hidden:true};legendMeta(L=>L.tabs.push(nt));ui.lgTab=nt.id;render();document.getElementById('lg-tab-title')?.select();return}

    if(ui.tab==='lore'){const a=S.lore.find(x=>x.id===ui.lore)||S.lore[0];src=(a&&photoSrc(a.cover))||photoSrc(B.bgLore)}

function shrink(file,max,fmt){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

      if(fmt==='png'){const d=c.toDataURL('image/png');if(d.length<380000){res(d);return}}
      cx.globalCompositeOperation='destination-over';cx.fillStyle='#17181e';cx.fillRect(0,0,c.width,c.height);

    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не получилось прочитать файл. Попробуйте JPG или PNG.'))};
    img.src=url;
  });
}

const hasText=html=>/<img/i.test(html||'')||(html||'').replace(/<[^>]*>/g,'').replace(/&nbsp;|\s/g,'').length>0;
function sanitize(html){
  const tpl=document.createElement('template'); tpl.innerHTML=html||'';
  const OK=new Set(['P','DIV','H2','H3','H4','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','BR','BLOCKQUOTE','IMG','A']);
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','SVG','VIDEO','AUDIO','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);
  const strip=n=>[...n.attributes].forEach(a=>n.removeAttribute(a.name));
  (function walk(node){
    [...node.childNodes].forEach(n0=>{
      let n=n0;
      if(n.nodeType===3) return;
      if(n.nodeType!==1){n.remove();return}
      if(DROP.has(n.tagName)){n.remove();return}
      if(n.tagName==='H1'){const x=document.createElement('h2');x.append(...n.childNodes);n.replaceWith(x);n=x}
      if(!OK.has(n.tagName)){walk(n);n.replaceWith(...n.childNodes);return}
      if(n.tagName==='IMG'){const src=n.getAttribute('src')||'',cl=(n.getAttribute('class')||'').split(/\s+/).filter(c=>IMG_CLS.includes(c));strip(n);if(!/^data:image\/(png|jpe?g|webp|gif);/i.test(src)){n.remove();return}n.setAttribute('src',src);if(cl.length)n.setAttribute('class',cl.join(' '));return}
      if(n.tagName==='A'&&n.getAttribute('data-loreref')){
        const lid=n.getAttribute('data-loreref'), a=S.lore.find(x=>x.id===lid), label=n.textContent; strip(n);
        n.setAttribute('data-loreref',lid);n.setAttribute('contenteditable','false');n.className='lore-ref'+(a?'':' missing');
        n.textContent=a?(a.title||'Без названия'):(label||'статья удалена');return}
      if(n.tagName==='A'){
        const rid=n.getAttribute('data-role'); if(!rid){walk(n);n.replaceWith(...n.childNodes);return}
        const r=S.roles.find(x=>x.id===rid), label=n.textContent; strip(n);
        n.setAttribute('data-role',rid);n.setAttribute('contenteditable','false');n.className='role-link'+(r?'':' missing');
        n.textContent=r?r.name:(label||'роль удалена');return}
      strip(n);walk(n);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

// caret positions are stored as child-index paths: live Range objects collapse when the editor is re-attached
function pathOf(n,root){const p=[];while(n&&n!==root){const par=n.parentNode;if(!par)return null;p.unshift([...par.childNodes].indexOf(n));n=par}return n===root?p:null}
function nodeAt(p,root){let n=root;for(const i of p){n=n&&n.childNodes[i];}return n||null}
function rangeToPath(ed){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;const r=s.getRangeAt(0);const a=pathOf(r.startContainer,ed),b=pathOf(r.endContainer,ed);return a&&b?{a,ao:r.startOffset,b,bo:r.endOffset}:null}
function pathToRange(ed,p){const s=getSelection();s.removeAllRanges();const r=document.createRange();
  try{const a=nodeAt(p.a,ed),b=nodeAt(p.b,ed);if(!a||!b)throw 0;r.setStart(a,p.ao);r.setEnd(b,p.bo)}catch(_){r.selectNodeContents(ed);r.collapse(false)}
  s.addRange(r)}
function saveRange(){const ed=document.getElementById('lg-editor');lgRange=ed?rangeToPath(ed):null}
function restoreRange(){
  const ed=document.getElementById('lg-editor'); if(!ed) return false;
  ed.focus({preventScroll:true});
  if(lgRange) pathToRange(ed,lgRange); else {const s=getSelection(),r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}
  return true;
}

}

function dataToBytes(d){const b=atob(d.slice(d.indexOf(',')+1));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function imgSize(d){return new Promise(res=>{const i=new Image();i.onload=()=>res({w:i.naturalWidth||400,h:i.naturalHeight||300});i.onerror=()=>res({w:400,h:300});i.src=d})}
async function imageRun(D,d,maxW){const {w,h:hh}=await imgSize(d);const k=Math.min(1,maxW/w);return new D.ImageRun({data:dataToBytes(d),transformation:{width:Math.round(w*k),height:Math.round(hh*k)}})}
function imgW(n){const c=n.classList;return c.contains('img-s')?180:c.contains('img-m')?300:c.contains('img-l')?450:620}
async function htmlToParas(D,html,all){
  const tpl=document.createElement('template'); tpl.innerHTML=sanitize(html);
  const BLOCK=new Set(['P','DIV','H2','H3','H4','UL','OL','BLOCKQUOTE','IMG']);
  const paras=[]; let buf=[];
  const flush=()=>{if(buf.length){paras.push(new D.Paragraph({children:buf,spacing:{after:160}}));buf=[]}};
  async function runs(node,fmt){
    const out=[];
    for(const n of node.childNodes){
      if(n.nodeType===3){const tx=n.textContent.replace(/ /g,' ');if(tx)out.push(new D.TextRun({text:tx,...fmt}));continue}
      if(n.nodeType!==1) continue;
      const tg=n.tagName;
      if(tg==='BR'){out.push(new D.TextRun({text:'',break:1}));continue}
      if(tg==='IMG'){out.push(await imageRun(D,n.getAttribute('src'),imgW(n)));continue}
      if(tg==='A'&&n.getAttribute('data-loreref')){out.push(new D.TextRun({text:n.textContent,...fmt,italics:true,color:'4F6B7D'}));continue}
      if(tg==='A'){const rid=n.getAttribute('data-role');const tr=new D.TextRun({text:n.textContent,...fmt,color:'8A6A2B',underline:{}});
        out.push(all&&exportIds.has(rid)?new D.InternalHyperlink({anchor:'role_'+rid,children:[tr]}):tr);continue}
      const f={...fmt};
      if(tg==='B'||tg==='STRONG')f.bold=true; if(tg==='I'||tg==='EM')f.italics=true; if(tg==='U')f.underline={}; if(tg==='S'||tg==='STRIKE')f.strike=true;
      if(BLOCK.has(tg)&&out.length)out.push(new D.TextRun({text:'',break:1}));
      out.push(...await runs(n,f));
    }
    return out;
  }
  for(const n of tpl.content.childNodes){
    if(n.nodeType===3){if(n.textContent.trim())buf.push(new D.TextRun(n.textContent.replace(/ /g,' ')));continue}
    if(n.nodeType!==1) continue;
    const tg=n.tagName;
    if(!BLOCK.has(tg)){buf.push(...await runs({childNodes:[n]},{}));continue}
    flush();
    if(tg==='H2'||tg==='H3'||tg==='H4') paras.push(new D.Paragraph({heading:tg==='H2'?D.HeadingLevel.HEADING_2:D.HeadingLevel.HEADING_3,children:await runs(n,{})}));
    else if(tg==='UL'||tg==='OL'){let i=0;for(const li of n.children){i++;const ch=await runs(li,{});paras.push(tg==='UL'?new D.Paragraph({bullet:{level:0},children:ch}):new D.Paragraph({children:[new D.TextRun(i+'. '),...ch],indent:{left:360,hanging:360}}))}}
    else if(tg==='BLOCKQUOTE') paras.push(new D.Paragraph({children:await runs(n,{italics:true}),indent:{left:567},spacing:{after:160},border:{left:{style:D.BorderStyle.SINGLE,size:12,color:'C9A65E',space:8}}}));
    else if(tg==='IMG') paras.push(new D.Paragraph({children:[await imageRun(D,n.getAttribute('src'),imgW(n))],alignment:n.classList.contains('al-r')?D.AlignmentType.RIGHT:n.classList.contains('al-l')?D.AlignmentType.LEFT:D.AlignmentType.CENTER,spacing:{after:160}}));
    else{const ch=await runs(n,{});paras.push(new D.Paragraph({children:ch.length?ch:[new D.TextRun('')],spacing:{after:160}}))}
  }
  flush();
  return paras;
}
async function roleSection(D,x,all,override){
  const r=x.r, out=[], name=new D.TextRun(r.name);
  out.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_1,pageBreakBefore:all,children:all?[new D.Bookmark({id:'role_'+r.id,children:[name]})]:[name]}));
  const meta=[x.t?.name,r.title,r.player?'Игрок: '+r.player:''].filter(Boolean).join(' · ');
  if(meta) out.push(new D.Paragraph({children:[new D.TextRun({text:meta,italics:true,color:'8A6A2B'})],spacing:{after:200}}));
  const src=photoSrc(r.photo); if(src) out.push(new D.Paragraph({children:[await imageRun(D,src,170)],spacing:{after:200}}));
  const doc=override!=null?(typeof override==='string'?{html:override,tabs:[]}:override):(LG&&LG[r.id])||{html:'',tabs:[]};
  const html=doc.html||'';
  if(hasText(html)) out.push(...await htmlToParas(D,html,all));
  else if(!(doc.tabs||[]).length) out.push(new D.Paragraph({children:[new D.TextRun({text:'Легенда ещё не написана.',italics:true,color:'888888'})]}));
  for(const t of (doc.tabs||[])){
    out.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_2,children:[new D.TextRun(t.title||'Без названия'),...(t.hidden?[new D.TextRun({text:'  (скрыто от игрока)',italics:true,size:20,color:'999999'})]:[])]}));
    if(hasText(t.html)) out.push(...await htmlToParas(D,t.html,all));
  }
  return out;
}
async function exportDocx(all,opt){
  const st=opt&&opt.status||setStatus;
  if(!opt) flushLegend(); st('Готовлю файл Word…');
  try{
    await loadDocx(); const D=window.docx;
    const list=all?orderedRoles():orderedRoles().filter(x=>x.r.id===(opt?opt.role:ui.legend));
    exportIds=new Set(list.map(x=>x.r.id));
    const ch=[];
    if(all){
      ch.push(new D.Paragraph({heading:D.HeadingLevel.TITLE,children:[new D.TextRun(S.hero.title)]}));
      ch.push(new D.Paragraph({children:[new D.TextRun({text:'Легенды персонажей',italics:true,color:'8A6A2B',size:28})],spacing:{after:300}}));
      let lastT=null;
      list.forEach(x=>{const tn=x.t?x.t.name:'Без команды';
        if(tn!==lastT){ch.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_3,children:[new D.TextRun(tn)]}));lastT=tn}
        ch.push(new D.Paragraph({children:[new D.InternalHyperlink({anchor:'role_'+x.r.id,children:[new D.TextRun({text:x.r.name,color:'8A6A2B',underline:{}})]}),new D.TextRun({text:x.r.title?' · '+x.r.title:'',color:'777777'})]}))});
    }
    for(const x of list) ch.push(...await roleSection(D,x,all,opt?opt.html:null));
    const doc=new D.Document({creator:S.hero.title,title:all?'Легенды':'Легенда: '+list[0].r.name,
      styles:{default:{document:{run:{font:'Georgia',size:23}},title:{run:{font:'Georgia',size:52,color:'5A1E19'}},heading1:{run:{font:'Georgia',size:40,color:'5A1E19'},paragraph:{spacing:{after:120}}},heading2:{run:{font:'Georgia',size:30,color:'8A6A2B'},paragraph:{spacing:{before:240,after:120}}},heading3:{run:{font:'Georgia',size:26,bold:true},paragraph:{spacing:{before:200,after:80}}}}},
      sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:ch}]});
    const blob=await D.Packer.toBlob(doc);
    const fname=((all?'Легенды — '+S.hero.title:'Легенда — '+list[0].r.name).replace(/[\\/:*?"<>|]+/g,' ').trim())+'.docx';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    st('Файл Word скачан');
  }catch(e){console.error(e);st('Не получилось собрать файл Word. Проверьте интернет и попробуйте ещё раз.')}
}

/* ---------------- save ---------------- */
async function save(){
  ui.saving=true;ui.err='';render();
  const {data,error}=await sb.rpc('save_site_content',{p_pin:pin,p_data:S});
  if(error){ui.err='Не сохранилось: '+rpcErr(error)}
  else if(!data){ui.err='Код мастера больше не подходит. Выйдите и войдите заново.'}
  else{
    saved=JSON.stringify(S);
    sb.rpc('delete_role_photos',{p_pin:pin,p_keep:photoIds()});
    ui.saving=false;toast('Сохранено');return;
  }
  ui.saving=false;render();
}
window.addEventListener('beforeunload',ev=>{if(isMaster()&&(dirty()||lgTimer||lgSavingN||grTimer||grSaving)){ev.preventDefault();ev.returnValue=''}});
window.addEventListener('resize',measure);

function photoIds(){return S.roles.map(r=>r.photo||'').concat(S.teams.map(t=>t.icon||''),S.lore.map(a=>a.cover||''),(S.rules||[]).map(a=>a.cover||''),Object.values(S.brand||{})).filter(p=>p.startsWith('ph:')).map(p=>p.slice(3))}

/* ---------------- boot ---------------- */
const hash=(location.hash||'').slice(1);
if(tabs().some(([k])=>k===hash))ui.tab=hash;
render();
sb.from('site_content').select('data').eq('id',1).maybeSingle().then(({data,error})=>{
  if(error){ui.loadErr=true}
  else if(data&&data.data){S=Object.assign({hero:{eyebrow:'',title:'',text:''},about:'',lore:[],rules:[],teams:[],roles:[],map:{}},data.data);saved=JSON.stringify(S)}
  ui.loading=false;render();
  sb.rpc('list_pinned_roles').then(({data,error})=>{if(!error&&Array.isArray(data)){PINNED=new Set(data);render()}});
  const ids=photoIds();
  if(ids.length) sb.from('role_photos').select('id,data').in('id',ids).then(({data})=>{(data||[]).forEach(p=>photos[p.id]=p.data);render()});
});
})();
