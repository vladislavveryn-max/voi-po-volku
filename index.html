<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Игра Престолов: Вой по волку</title>
<meta name="description" content="Ролевая игра живого действия «Игра Престолов: Вой по волку»: об игре, лор и сетка ролей.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Forum&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: sticky iron topbar (sigil + title + tabs) over a torch-lit hero; content column below.
   Lore = sticky index + reading pane; roles = house sections with framed portrait cards. */
:root{
  --bg:#0d0e11; --bg-2:#121318; --surface:#17181e; --raised:#1f2027; --line:#2a2b33;
  --gold:#c9a65e; --gold-hi:#e3c482; --gold-line:rgba(201,166,94,.32);
  --crimson:#8f2b24; --crimson-hi:#ab372e;
  --fg:#ebe4d4; --muted:#9b9485; --ok:#8aac77;
  --display:"Forum","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --tb:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tb) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(13,14,17,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold-line)}
.tb-row{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{flex:none;width:26px;height:30px}
.brand-name{font-family:var(--display);font-size:21px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{position:relative;background:none;border:0;padding:18px 14px;cursor:pointer;color:var(--muted);
  font-family:var(--display);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--gold)}
.tb-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.icon-btn:hover{color:var(--fg);border-color:var(--gold-line)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--gold-line);
  background:
    radial-gradient(90% 120% at 15% 0%, rgba(143,43,36,.28), transparent 60%),
    radial-gradient(70% 90% at 100% 100%, rgba(201,166,94,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg))}
.hero .col{padding-block:56px 48px;display:grid;gap:18px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,var(--gold),transparent)}
.hero h1{font-size:clamp(38px,7.4vw,82px);color:var(--fg);letter-spacing:.015em}
.hero h1 .sep{color:var(--gold)}
.lead{max-width:64ch;font-size:18px;color:#d8d0bf}
.lead p{margin:0 0 .8em}.lead p:last-child{margin:0}
.hero-mark{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:min(42vw,420px);opacity:.07;pointer-events:none}

/* page */
main.col{padding-block:36px 140px}
.section-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-title h2{font-size:clamp(28px,4vw,38px)}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.prose{max-width:68ch}
.prose h3{font-size:30px;margin:1.5em 0 .45em;color:var(--gold-hi)}
.prose h4{font-size:23px;margin:1.3em 0 .35em}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1.1em;padding-left:0;list-style:none}
.prose li{position:relative;padding-left:22px;margin-bottom:.4em}
.prose li::before{content:"";position:absolute;left:4px;top:.68em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prose strong{color:#fff3dc;font-weight:600}
.empty{color:var(--muted);font-style:italic}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:6px;
  padding:9px 16px;font-size:15px;cursor:pointer;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.primary:hover{background:var(--crimson-hi)}
.btn.gold{background:transparent;border-color:var(--gold-line);color:var(--gold-hi)}
.btn.danger{color:#eaa497;border-color:rgba(171,55,46,.6);background:transparent}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:grid;gap:5px;margin-bottom:16px}
.field label,.field .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-line);outline:none}
.field textarea{line-height:1.6;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.field label.btn{text-transform:none;letter-spacing:normal;font-size:13px;color:var(--gold-hi)}
.edit-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--gold-line);background:rgba(201,166,94,.06);
  border-radius:8px;padding:10px 14px;font-size:14px;color:#d9cfb9;margin-bottom:24px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* lore */
.lore{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:2px;max-height:calc(100vh - var(--tb) - 60px);overflow:auto;padding-right:4px}
.lore-nav .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.lore-item{display:flex;align-items:center}
.lore-link{flex:1;min-width:0;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1.3}
.lore-link:hover{color:var(--fg);background:var(--surface)}
.lore-link[aria-current="true"]{color:var(--gold-hi);background:var(--surface)}
.mv{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:11px}
.lore-gh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);margin-top:6px;padding:12px 12px 8px;cursor:pointer;color:var(--fg);font-family:var(--display);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.lore-gh:hover{color:var(--gold-hi)}
.lore-gh .ar{display:inline-block;color:var(--gold);font-size:11px;transition:transform .15s}
.lore-gh[aria-expanded="true"] .ar{transform:rotate(90deg)}
.lore-gh .gn{flex:1;min-width:0}
.lore-gh .lgc{font-size:11px;color:var(--muted);letter-spacing:0}
.lore-item.in-grp .lore-link{padding-left:28px}
.music{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);background:rgba(14,15,18,.92);backdrop-filter:blur(6px);border:1px solid var(--gold-line);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:14px;color:var(--muted)}
.music[hidden]{display:none}
.mu-btn{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--gold);color:var(--bg);cursor:pointer;display:grid;place-items:center}
.mu-btn svg{width:14px;height:14px;fill:currentColor}
.mu-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.music.playing .mu-name{color:var(--gold-hi)}
#mu-vol{width:84px;accent-color:var(--gold)}
.mus-edit{display:grid;gap:8px;justify-items:start}
.mus-edit #f-lmusic-url{width:100%}
.mus-row{display:flex;gap:8px;flex-wrap:wrap}
.mus-now{color:var(--gold-hi)}
.mus-vol-l{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);text-transform:none;letter-spacing:normal}
.mus-vol-l input{accent-color:var(--gold)}
body:has(.savebar) .music{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){#mu-vol{width:64px}.mu-name{max-width:140px}}
.md-img{margin:22px 0;text-align:center}
.md-img img{max-width:100%;max-height:75vh;border-radius:6px;border:1px solid var(--line);display:inline-block}
.md-img figcaption{margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}
.md-img-ph{padding:30px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px}
.raven{max-width:1180px;margin:0 auto}
.rv-head h2{font-size:clamp(34px,5vw,52px);margin:0 0 8px}
.rv-lead{color:var(--muted);max-width:70ch;margin:0 0 26px}
.rv-lead a{color:var(--gold-hi)}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:36px;align-items:start}
.rv-form{display:grid;gap:4px}
.rv-form select,.rv-form textarea{width:100%}
.rv-seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.rv-seal{display:grid;justify-items:center;gap:8px;padding:12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--fg);cursor:pointer;font:inherit;font-size:14px;line-height:1.2;text-align:center}
.rv-seal img,.rv-ini{width:54px;height:54px;object-fit:contain;border-radius:6px}
.rv-ini{display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--gold);border:1px solid var(--gold-line);border-radius:50%}
.rv-seal:hover{border-color:var(--gold-line)}
.rv-seal[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,166,94,.12);color:var(--gold-hi)}
.rv-prev{position:sticky;top:calc(var(--tb) + 20px);display:grid;gap:8px;justify-items:center}
.rv-prev canvas{width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.rv-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:8px}
.rv-msg{font-size:15px;color:var(--muted)}.rv-msg.ok{color:var(--ok)}.rv-msg.err{color:#e0907e}
.rv-cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.rv-setup,.rv-seal-ed{margin-top:26px;padding:16px 18px;border:1px dashed var(--gold-line);border-radius:10px;font-size:15px}
.rv-seal-ed{margin:10px 0 14px;display:grid;gap:8px}
.rv-setup ol{margin:0 0 12px;padding-left:20px;color:var(--muted)}.rv-setup code{color:var(--gold-hi)}
.rv-se-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-se-row input[data-sealname]{flex:1;min-width:140px}
.rv-se-ic{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}.rv-se-ic img{max-width:36px;max-height:36px}
@media (max-width:900px){.rv-grid{grid-template-columns:1fr}.rv-prev{position:static;max-width:420px;margin:0 auto}.rv-seals{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
.gw{max-width:1180px;margin:0 auto}
.gw-rules{margin:0 0 22px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
.gw-rules summary{cursor:pointer;color:var(--gold-hi);font-family:var(--display);letter-spacing:.06em}
.gw-rules p{font-size:15px;color:#d6cebd;margin:10px 0 0}
.gw-facs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.gw-deckbar{position:sticky;top:calc(var(--tb) + 6px);z-index:4;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:rgba(14,15,18,.95);border:1px solid var(--gold-line);border-radius:12px;padding:10px 14px;margin:6px 0 18px}
.gw-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}.gw-stats b{color:var(--fg)}.gw-stats .bad,.gw-stats .bad b{color:#e0907e}
.gw-go{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.gw-go select{max-width:240px}
.gw-sec{margin-bottom:22px}
.gw-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gw-pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;opacity:.6;transition:opacity .15s,border-color .15s}
.gw-pc.on{opacity:1;border-color:var(--gold-line)}
.gw-pc .gc{width:100%;height:auto;aspect-ratio:3/4;font-size:15px}
.gw-pc-b{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gw-cnt{display:flex;align-items:center;gap:2px}.gw-cnt b{min-width:30px;text-align:center;color:var(--fg)}.gw-cnt .mv{font-size:18px;padding:2px 8px}.gw-cnt .mv:disabled{opacity:.3}
.gw-pc-d{font-size:12.5px;line-height:1.35;color:var(--muted)}
.gw-pc-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc{--w:64px;position:relative;width:var(--w);height:calc(var(--w)*1.36);flex:none;border-radius:6px;overflow:hidden;background:radial-gradient(80% 60% at 50% 35%,#2a2b33,#14151a);border:1px solid rgba(201,166,94,.35);box-shadow:0 2px 6px rgba(0,0,0,.45);user-select:none;font-size:12px}
.gc img{width:100%;height:100%;object-fit:cover;display:block}
.gc.ico img{object-fit:contain;padding:18% 14% 22%;opacity:.8}
.gc.hero{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 2px 8px rgba(201,166,94,.35)}
.gc.sp{background:radial-gradient(80% 70% at 50% 40%,#3a2d1d,#16120d)}
.gc-ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--w)*.45);color:rgba(201,166,94,.55)}
.gc.sp .gc-ini{font-family:inherit;color:#fff;font-size:calc(var(--w)*.5)}
.gc-p{position:absolute;left:3px;top:3px;min-width:calc(var(--w)*.34);height:calc(var(--w)*.34);padding:0 2px;border-radius:999px;display:grid;place-items:center;background:#ebe4d4;color:#16120d;font-weight:700;font-size:calc(var(--w)*.2);line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.gc-p.hero{background:var(--gold);color:#16120d}.gc-p.up{background:#9fd18a}.gc-p.down{background:#e79a8a}
.gc-r,.gc-a{position:absolute;bottom:2px;font-size:calc(var(--w)*.2);line-height:1;padding:2px 3px;border-radius:4px;background:rgba(10,10,12,.72)}
.gc-r{right:2px}.gc-a{left:2px}
.gc-n{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 4px;background:linear-gradient(transparent,rgba(8,8,10,.92) 45%);color:#f1ead9;font-size:12px;line-height:1.15;text-align:center}
.gw-pc .gc-r,.gw-mcard .gc-r{right:3px;top:3px;bottom:auto}.gw-pc .gc-a,.gw-mcard .gc-a{left:auto;right:3px;top:calc(var(--w)*.3);bottom:auto}.gw-mcard .gc-r,.gw-mcard .gc-a{font-size:22px;right:8px}.gw-mcard .gc-r{top:8px}.gw-mcard .gc-a{top:48px}
.gw-game{max-width:1100px}
.gw-board{display:grid;gap:4px;background:linear-gradient(#17140f,#120f0b);border:1px solid rgba(201,166,94,.3);border-radius:12px;padding:8px}
.gw-info{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);font-size:14px;color:var(--muted)}
.gw-info.turn{box-shadow:inset 0 0 0 1px var(--gold)}
.gw-nm{display:grid;line-height:1.15;min-width:0}.gw-nm b{color:var(--fg)}.gw-nm span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gw-lives{display:flex;gap:4px}.gw-lives i{width:12px;height:12px;border-radius:50%;border:1px solid #a33;background:transparent}.gw-lives i.on{background:radial-gradient(circle at 35% 35%,#ff7b6b,#a01c13)}
.gw-pass{color:#e0907e;text-transform:uppercase;font-size:12px;letter-spacing:.12em}
.gw-dk{font-size:12px}.gw-dk::before{content:"колода ";}
.gw-tot{margin-left:auto;font-family:var(--display);font-size:28px;color:var(--gold-hi);min-width:44px;text-align:right}
.gw-row .gc{--w:54px}
.gw-row{display:flex;align-items:center;gap:6px;min-height:calc(54px*1.36 + 8px);padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.025);position:relative}
.gw-row.wx{background:rgba(120,150,190,.12)}
.gw-rs{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#2b2418;color:var(--gold-hi);font-weight:700;font-size:14px}
.gw-hn{flex:none;width:30px;text-align:center;font-size:18px;opacity:.45}.gw-hn.on{opacity:1}
.gw-units{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:2px 0}
.gw-wx{position:absolute;right:8px;top:4px;font-size:18px}
.gw-mid{display:flex;justify-content:space-between;padding:6px 10px;font-size:13px;color:var(--muted);border-top:1px solid rgba(201,166,94,.25);border-bottom:1px solid rgba(201,166,94,.25)}
.gw-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:10px 0;padding:10px 12px;border:1px solid var(--gold-line);border-radius:10px;background:var(--surface);font-size:15px}
.gw-act.col{flex-direction:column;align-items:stretch}
.gw-sel{flex:1 1 300px;min-width:0}.gw-sel span{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gw-d{font-size:13.5px;color:#d6cebd;margin-top:4px}
.gw-btns{display:flex;flex-wrap:wrap;gap:8px}.gw-hint{color:var(--muted);font-size:14px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.gw-gr{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.gw-gr .gc{--w:84px}
.gw-dock{position:sticky;bottom:0;z-index:5;background:linear-gradient(rgba(12,13,16,.9),#0c0d10 30%);padding-top:6px;margin:0 -6px;padding-inline:6px}
.gw-dock .gw-act{margin:4px 0 0}
.gw-hand{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 10px}
.gw-hand .gc{--w:84px;cursor:pointer;transition:transform .12s}
.gw-hand .gc:hover{transform:translateY(-4px)}
.gw-hand .gc.sel{transform:translateY(-10px);box-shadow:0 0 0 2px var(--gold),0 8px 18px rgba(0,0,0,.6)}
.gw-hand .gc.mull{outline:1px dashed rgba(201,166,94,.5)}
.gc.pick{cursor:pointer;box-shadow:0 0 0 2px #9fd18a}

function contactHref(c){
  if(/^https?:\/\/\S+$/i.test(c)) return c;
  if(/^(t\.me|telegram\.me|vk\.com|vk\.ru|wa\.me|instagram\.com|discord\.gg)\/\S+$/i.test(c)) return 'https://'+c;
  if(/^@[A-Za-z0-9_]{4,32}$/.test(c)) return 'https://t.me/'+c.slice(1);
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return 'mailto:'+c;
  if(/^\+?[\d\s()-]{7,}$/.test(c)) return 'tel:'+c.replace(/[^\d+]/g,'');
  return '';
}

function applyFmt(id,kind){
  const ta=document.getElementById(id); if(!ta) return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  let ins,cs,ce;
  if(kind==='b'||kind==='i'){const w=kind==='b'?'**':'*';ins=w+(sel||'текст')+w;cs=s+w.length;ce=cs+(sel||'текст').length}
  else{const ls=v.lastIndexOf('\n',s-1)+1;const pre=kind==='h'?'## ':'- ';const block=v.slice(ls,e)||'';const lines=(block||'').split('\n').map(l=>pre+l.replace(/^(## |- )/,''));
    const rep=lines.join('\n');ta.setRangeText(rep,ls,e,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();return}
  ta.setRangeText(ins,s,e,'end');ta.setSelectionRange(cs,ce);ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();
}

  if(ds.gwdeck||ds.gwadd){const F=ui.gwF,d=gwDeck(F),id=ds.gwadd||ds.gwdeck,dir=ds.gwadd?1:+ds.dir,c=gwDefs(F).find(x=>x.id===id);
    if(c&&gwLocked(c)&&dir>0){gwSfx(['down']);toast(`Наградная карта: откроется после ${gwNeed(c)} ${plural(gwNeed(c),'победы','побед','побед')}${PL.me?` (у вас ${PL.me.wins})`:' — войдите и побеждайте'}`);return true}
    if(c&&!c.off&&!(c.special&&GW_SP[c.special].rare)){const was=d[c.id]||0,nv=Math.max(0,Math.min(c.max,was+dir));if(nv!==was){d[c.id]=nv;gwSaveDeck(F,d);ui.gwFlash=c.id;gwSfx([dir>0?'land':'back'])}else if(dir>0)gwSfx(['down'])}render();return true}
  if(ds.gwtab){ui.gwTab=ds.gwtab;render();return true}
  if(ds.gwrowf){ui.gwRowF=ds.gwrowf;render();return true}
  if(t.id==='gw-dp-tog'){ui.gwDeckOpen=!ui.gwDeckOpen;render();return true}
  if(t.id==='gw-all'){const F=ui.gwF,d=gwDeck(F);gwDefs(F).forEach(c=>{if(!c.special&&!c.off&&!gwLocked(c))d[c.id]=c.max});gwSaveDeck(F,d);render();return true}
  if(t.id==='gw-clear'){gwSaveDeck(ui.gwF,{});render();return true}
  if(t.id==='gw-mode-ai'||t.id==='gw-mode-hot'){ui.gwMode=t.id==='gw-mode-hot'?'hot':'ai';render();return true}
  if(t.id==='gw-play'){gwStart(ui.gwF,ui.gwOp,ui.gwMode);render();gwMusicGo();window.scrollTo(0,0);return true}
  if(!GM)return false;
  const G=GM,A=gwActor(G),me=G.p[A];
  if(t.id==='gw-ready'){G.shown=G.phase==='mulligan'?G.mside:G.turn;G.sel=null;render();window.scrollTo(0,0);return true}
  if(gwHandover(G)&&(ds.gwhand||ds.gwplay||ds.gwdecoy||ds.gwpoison||ds.gwmedic||ds.gwmerc||t.id==='gw-pass'))return true;
  if(ds.gwmerc!==undefined&&G.pick&&G.pick.type==='merc'){const def=G.pick.opts[+ds.gwmerc];G.pick=null;if(def){const res=gwHire(G,A,def,false);if(res==='medic'){G.pick={type:'medic'};render();return true}}gwNext(G,A);render();gwTick();return true}
  if(ds.gwhand){
    if(G.phase==='mulligan'){const k=me.hand.findIndex(c=>c.uid===ds.gwhand);if(k>=0&&G.mull>0&&me.deck.length){const old=me.hand[k];me.hand[k]=me.deck.shift();me.deck.splice(Math.floor(Math.random()*(me.deck.length+1)),0,old);G.mull--;G.log.unshift(G.mode==='hot'?me.name+': замена карты.':'Вы заменили карту.');if(!G.mull)gwMullDone(G)}render();gwTick();return true}
    if(G.phase==='play'&&G.turn===A&&!G.pick){G.sel=G.sel===ds.gwhand?null:ds.gwhand;if(G.sel)gwSfx(['pick']);render()}return true}
  if(t.id==='gw-mull-done'){gwMullDone(G);render();gwTick();return true}
  if(t.id==='gw-unsel'||t.id==='gw-unsel2'){G.sel=null;render();return true}
  if(ds.gwplay&&G.sel){const k=me.hand.findIndex(c=>c.uid===G.sel);if(k<0)return true;G.sel=null;G.banner='';let pr=ds.gwplay==='-'?null:ds.gwplay,tg=null;if(pr&&pr.includes('|')){const q=pr.split('|');tg=+q[0];pr=q[1]}const res=gwPlayFromHand(G,A,k,pr,tg,false);if(res==='medic'){G.pick={type:'medic'};render();return true}if(res==='merc'){render();return true}gwNext(G,A);render();gwTick();return true}
  if(ds.gwpoison&&G.sel){const k=me.hand.findIndex(c=>c.uid===G.sel);const f=gwFindUnit(G.p[1-A],ds.gwpoison);if(k<0||!f)return true;G.sel=null;gwPlayFromHand(G,A,k,f.r,ds.gwpoison,false);gwNext(G,A);render();gwTick();return true}
  if(ds.gwdecoy&&G.sel){const k=me.hand.findIndex(c=>c.uid===G.sel);const f=gwFindUnit(me,ds.gwdecoy);if(k<0||!f)return true;G.sel=null;gwPlayFromHand(G,A,k,f.r,ds.gwdecoy,false);gwNext(G,A);render();gwTick();return true}
  if(ds.gwmedic&&G.pick){const c=me.grave.find(x=>x.uid===ds.gwmedic);G.pick=null;if(c){me.grave.splice(me.grave.indexOf(c),1);G.log.unshift(`${me.name}: исцеление возвращает «${c.name}».`);(G.sfx=G.sfx||[]).push('medic');if(A===0&&(G.heal0=(G.heal0||0)+1)>=3)gwFeat(G,'heal3');const res=gwApply(G,A,c,c.row==='a'?'m':c.row,null,false);if(res==='medic'){G.pick={type:'medic'};render();return true}}gwNext(G,A);render();gwTick();return true}
  if(t.id==='gw-medic-skip'){G.pick=null;gwNext(G,A);render();gwTick();return true}
  if(t.id==='gw-pass'){G.sel=null;gwPass(G,A);render();gwTick();return true}
  if(t.id==='gw-quit'){G.phase='over';G.surrender=true;G.winner=1-A;G.banner=G.mode==='hot'?`${me.name} сдаётся. Победа: ${G.p[1-A].name}`:'Вы сдались';G.p[A].lives=0;render();return true}
  if(t.id==='gw-again'){const F=G.p[0].faction,o=G.mode==='hot'?G.p[1].faction:ui.gwOp;gwStart(F,o,G.mode);render();gwMusicGo();return true}
  if(t.id==='gw-rotate'){const el=document.documentElement;const go=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};
    try{const r=el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():null;if(r&&r.then)r.then(go,go);else go()}catch(_){go()}
    setTimeout(()=>{if(matchMedia('(orientation:portrait)').matches){const b=document.getElementById('gw-rotate');if(b)b.textContent='Поверните телефон вручную (проверьте, что автоповорот включён)'}},900);return true}
  if(t.id==='gw-portrait'){ui.gwPortrait=true;render();return true}
  if(t.id==='gw-exit'){if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});GM=null;ui.gw='menu';render();return true}
  if(t.id==='gw-menu'){GM=null;ui.gw='menu';render();return true}
  if(t.id==='gw-reveal'){G.reveal=null;clearTimeout(gwTimer);gwTimer=0;render();return true}
  if(t.id==='gw-banner'&&G.phase!=='over'){G.banner='';clearTimeout(gwTimer);gwTimer=0;render();return true}
  return false;
}

function gwModalObj(id){ // → {kind, obj, def}
  if(!id)return null;
  if(id.startsWith('r:')){const r=S.roles.find(x=>x.id===id.slice(2));return r&&{kind:'role',obj:r,def:gwRoleDef(r)}}
  if(id.startsWith('x:')){const x=gwData().extras.find(y=>y.id===id.slice(2));return x&&{kind:'extra',obj:x,def:gwExtraDef(x)}}
  if(id.startsWith('t:')){const [,F,tid]=id.split(':'),t=gwTroopList().find(y=>y.id===tid);return t&&{kind:'troop',obj:t,def:gwTroopDef(t,F),F}}
  if(id.startsWith('m:')){const x=gwMercList().find(y=>y.id===id.slice(2));return x&&{kind:'merc',obj:x,def:gwMercDef(x)}}
  if(id.startsWith('sp:')){const k=id.slice(3),d=gwDefs(ui.gwF).find(c=>c.id===id);if(!d)return null;const g=gwData(),sm=g.spMeta=g.spMeta||{};return {kind:'special',obj:Object.assign({id:k},sm[k]||{}),def:d}}
  return null;
}

function shrink(file,max,fmt){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const cx=c.getContext('2d');cx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      if(fmt==='png'){const d=c.toDataURL('image/png');if(d.length<380000){res(d);return}}
      cx.globalCompositeOperation='destination-over';cx.fillStyle='#17181e';cx.fillRect(0,0,c.width,c.height);
      let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не получилось прочитать файл. Попробуйте JPG или PNG.'))};
    img.src=url;
  });
}

function grFit(){
  const st=document.getElementById('gr-stage'); if(!st) return; const g=grCur();
  if(!g.nodes.length){grView={s:1,tx:st.clientWidth/2,ty:st.clientHeight/2};return}
  const xs=g.nodes.map(n=>n.x),ys=g.nodes.map(n=>n.y), minX=Math.min(...xs)-70,maxX=Math.max(...xs)+70,minY=Math.min(...ys)-60,maxY=Math.max(...ys)+80;
  const s=Math.min(1.4,Math.max(.2,Math.min(st.clientWidth/(maxX-minX),st.clientHeight/(maxY-minY))));
  grView={s,tx:st.clientWidth/2-(minX+maxX)/2*s,ty:st.clientHeight/2-(minY+maxY)/2*s};
}
function grApply(){const w=document.getElementById('gr-world');if(w&&grView)w.setAttribute('transform',`translate(${grView.tx.toFixed(1)},${grView.ty.toFixed(1)}) scale(${grView.s.toFixed(4)})`)}
function grZoomAt(f,cx,cy){const v=grView;if(!v)return;const ns=Math.min(3,Math.max(.15,v.s*f)),k=ns/v.s;v.tx=cx-(cx-v.tx)*k;v.ty=cy-(cy-v.ty)*k;v.s=ns;grApply()}

function grWorld(ev){const st=document.getElementById('gr-stage'),r=st.getBoundingClientRect();return {x:(ev.clientX-r.left-grView.tx)/grView.s,y:(ev.clientY-r.top-grView.ty)/grView.s}}

function grFreeSpot(g){

function grPointerEnd(ev,cancel){

function sanitize(html){
  const tpl=document.createElement('template'); tpl.innerHTML=html||'';
  const OK=new Set(['P','DIV','H2','H3','H4','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','BR','BLOCKQUOTE','IMG','A']);
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','SVG','VIDEO','AUDIO','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);
  const strip=n=>[...n.attributes].forEach(a=>n.removeAttribute(a.name));
  (function walk(node){
    [...node.childNodes].forEach(n0=>{
      let n=n0;
      if(n.nodeType===3) return;
      if(n.nodeType!==1){n.remove();return}
      if(DROP.has(n.tagName)){n.remove();return}
      if(n.tagName==='H1'){const x=document.createElement('h2');x.append(...n.childNodes);n.replaceWith(x);n=x}
      if(!OK.has(n.tagName)){walk(n);n.replaceWith(...n.childNodes);return}
      if(n.tagName==='IMG'){const src=n.getAttribute('src')||'',cl=(n.getAttribute('class')||'').split(/\s+/).filter(c=>IMG_CLS.includes(c));strip(n);if(!/^data:image\/(png|jpe?g|webp|gif);/i.test(src)){n.remove();return}n.setAttribute('src',src);if(cl.length)n.setAttribute('class',cl.join(' '));return}
      if(n.tagName==='A'&&n.getAttribute('data-loreref')){
        const lid=n.getAttribute('data-loreref'), a=S.lore.find(x=>x.id===lid), label=n.textContent, own=n.getAttribute('data-txt')==='1'&&label.trim(); strip(n);
        n.setAttribute('data-loreref',lid);n.setAttribute('contenteditable','false');n.className='lore-ref'+(a?'':' missing');if(own)n.setAttribute('data-txt','1');
        n.textContent=own?label:a?(a.title||'Без названия'):(label||'статья удалена');return}
      if(n.tagName==='A'){
        const rid=n.getAttribute('data-role'); if(!rid){walk(n);n.replaceWith(...n.childNodes);return}
        const r=S.roles.find(x=>x.id===rid), label=n.textContent, own=n.getAttribute('data-txt')==='1'&&label.trim(); strip(n);
        n.setAttribute('data-role',rid);n.setAttribute('contenteditable','false');n.className='role-link'+(r?'':' missing');if(own)n.setAttribute('data-txt','1');
        n.textContent=own?label:r?r.name:(label||'роль удалена');return}
      strip(n);walk(n);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

// caret positions are stored as child-index paths: live Range objects collapse when the editor is re-attached
function pathOf(n,root){const p=[];while(n&&n!==root){const par=n.parentNode;if(!par)return null;p.unshift([...par.childNodes].indexOf(n));n=par}return n===root?p:null}

function pathToRange(ed,p){const s=getSelection();s.removeAllRanges();const r=document.createRange();
  try{const a=nodeAt(p.a,ed),b=nodeAt(p.b,ed);if(!a||!b)throw 0;r.setStart(a,p.ao);r.setEnd(b,p.bo)}catch(_){r.selectNodeContents(ed);r.collapse(false)}
  s.addRange(r)}
function saveRange(){const ed=document.getElementById('lg-editor');lgRange=ed?rangeToPath(ed):null}
function restoreRange(){
  const ed=document.getElementById('lg-editor'); if(!ed) return false;
  ed.focus({preventScroll:true});
  if(lgRange) pathToRange(ed,lgRange); else {const s=getSelection(),r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}
  return true;
}

function loadDocx(){
  if(window.docx) return Promise.resolve();
  if(!docxReady) docxReady=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';sc.onload=res;sc.onerror=()=>{docxReady=null;rej(new Error('lib'))};document.head.appendChild(sc)});
  return docxReady;
}
function dataToBytes(d){const b=atob(d.slice(d.indexOf(',')+1));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function imgSize(d){return new Promise(res=>{const i=new Image();i.onload=()=>res({w:i.naturalWidth||400,h:i.naturalHeight||300});i.onerror=()=>res({w:400,h:300});i.src=d})}
async function imageRun(D,d,maxW){const {w,h:hh}=await imgSize(d);const k=Math.min(1,maxW/w);return new D.ImageRun({data:dataToBytes(d),transformation:{width:Math.round(w*k),height:Math.round(hh*k)}})}
function imgW(n){const c=n.classList;return c.contains('img-s')?180:c.contains('img-m')?300:c.contains('img-l')?450:620}
async function htmlToParas(D,html,all){
  const tpl=document.createElement('template'); tpl.innerHTML=sanitize(html);
  const BLOCK=new Set(['P','DIV','H2','H3','H4','UL','OL','BLOCKQUOTE','IMG']);
  const paras=[]; let buf=[];
  const flush=()=>{if(buf.length){paras.push(new D.Paragraph({children:buf,spacing:{after:160}}));buf=[]}};
  async function runs(node,fmt){
    const out=[];
    for(const n of node.childNodes){
      if(n.nodeType===3){const tx=n.textContent.replace(/ /g,' ');if(tx)out.push(new D.TextRun({text:tx,...fmt}));continue}
      if(n.nodeType!==1) continue;
      const tg=n.tagName;
      if(tg==='BR'){out.push(new D.TextRun({text:'',break:1}));continue}
      if(tg==='IMG'){out.push(await imageRun(D,n.getAttribute('src'),imgW(n)));continue}
      if(tg==='A'&&n.getAttribute('data-loreref')){out.push(new D.TextRun({text:n.textContent,...fmt,italics:true,color:'4F6B7D'}));continue}
      if(tg==='A'){const rid=n.getAttribute('data-role');const tr=new D.TextRun({text:n.textContent,...fmt,color:'8A6A2B',underline:{}});
        out.push(all&&exportIds.has(rid)?new D.InternalHyperlink({anchor:'role_'+rid,children:[tr]}):tr);continue}
      const f={...fmt};
      if(tg==='B'||tg==='STRONG')f.bold=true; if(tg==='I'||tg==='EM')f.italics=true; if(tg==='U')f.underline={}; if(tg==='S'||tg==='STRIKE')f.strike=true;
      if(BLOCK.has(tg)&&out.length)out.push(new D.TextRun({text:'',break:1}));
      out.push(...await runs(n,f));
    }
    return out;
  }
  for(const n of tpl.content.childNodes){
    if(n.nodeType===3){if(n.textContent.trim())buf.push(new D.TextRun(n.textContent.replace(/ /g,' ')));continue}
    if(n.nodeType!==1) continue;
    const tg=n.tagName;
    if(!BLOCK.has(tg)){buf.push(...await runs({childNodes:[n]},{}));continue}
    flush();
    if(tg==='H2'||tg==='H3'||tg==='H4') paras.push(new D.Paragraph({heading:tg==='H2'?D.HeadingLevel.HEADING_2:D.HeadingLevel.HEADING_3,children:await runs(n,{})}));
    else if(tg==='UL'||tg==='OL'){let i=0;for(const li of n.children){i++;const ch=await runs(li,{});paras.push(tg==='UL'?new D.Paragraph({bullet:{level:0},children:ch}):new D.Paragraph({children:[new D.TextRun(i+'. '),...ch],indent:{left:360,hanging:360}}))}}
    else if(tg==='BLOCKQUOTE') paras.push(new D.Paragraph({children:await runs(n,{italics:true}),indent:{left:567},spacing:{after:160},border:{left:{style:D.BorderStyle.SINGLE,size:12,color:'C9A65E',space:8}}}));
    else if(tg==='IMG') paras.push(new D.Paragraph({children:[await imageRun(D,n.getAttribute('src'),imgW(n))],alignment:n.classList.contains('al-r')?D.AlignmentType.RIGHT:n.classList.contains('al-l')?D.AlignmentType.LEFT:D.AlignmentType.CENTER,spacing:{after:160}}));
    else{const ch=await runs(n,{});paras.push(new D.Paragraph({children:ch.length?ch:[new D.TextRun('')],spacing:{after:160}}))}
  }
  flush();
  return paras;
}
async function roleSection(D,x,all,override){
  const r=x.r, out=[], name=new D.TextRun(r.name);
  out.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_1,pageBreakBefore:all,children:all?[new D.Bookmark({id:'role_'+r.id,children:[name]})]:[name]}));
  const meta=[x.t?.name,r.title,r.player?'Игрок: '+r.player:''].filter(Boolean).join(' · ');
  if(meta) out.push(new D.Paragraph({children:[new D.TextRun({text:meta,italics:true,color:'8A6A2B'})],spacing:{after:200}}));
  const src=photoSrc(r.photo); if(src) out.push(new D.Paragraph({children:[await imageRun(D,src,170)],spacing:{after:200}}));
  const doc=override!=null?(typeof override==='string'?{html:override,tabs:[]}:override):(LG&&LG[r.id])||{html:'',tabs:[]};
  const html=doc.html||'';
  if(hasText(html)) out.push(...await htmlToParas(D,html,all));
  else if(!(doc.tabs||[]).length) out.push(new D.Paragraph({children:[new D.TextRun({text:'Легенда ещё не написана.',italics:true,color:'888888'})]}));
  for(const t of (doc.tabs||[])){
    out.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_2,children:[new D.TextRun(t.title||'Без названия'),...(t.hidden?[new D.TextRun({text:'  (скрыто от игрока)',italics:true,size:20,color:'999999'})]:[])]}));
    if(hasText(t.html)) out.push(...await htmlToParas(D,t.html,all));
  }
  return out;
}
async function exportDocx(all,opt){
  const st=opt&&opt.status||setStatus;
  if(!opt) flushLegend(); st('Готовлю файл Word…');
  try{
    await loadDocx(); const D=window.docx;
    const list=all?orderedRoles():orderedRoles().filter(x=>x.r.id===(opt?opt.role:ui.legend));
    exportIds=new Set(list.map(x=>x.r.id));
    const ch=[];
    if(all){
      ch.push(new D.Paragraph({heading:D.HeadingLevel.TITLE,children:[new D.TextRun(S.hero.title)]}));
      ch.push(new D.Paragraph({children:[new D.TextRun({text:'Легенды персонажей',italics:true,color:'8A6A2B',size:28})],spacing:{after:300}}));
      let lastT=null;
      list.forEach(x=>{const tn=x.t?x.t.name:'Без команды';
        if(tn!==lastT){ch.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_3,children:[new D.TextRun(tn)]}));lastT=tn}
        ch.push(new D.Paragraph({children:[new D.InternalHyperlink({anchor:'role_'+x.r.id,children:[new D.TextRun({text:x.r.name,color:'8A6A2B',underline:{}})]}),new D.TextRun({text:x.r.title?' · '+x.r.title:'',color:'777777'})]}))});
    }
    for(const x of list) ch.push(...await roleSection(D,x,all,opt?opt.html:null));
    const doc=new D.Document({creator:S.hero.title,title:all?'Легенды':'Легенда: '+list[0].r.name,
      styles:{default:{document:{run:{font:'Georgia',size:23}},title:{run:{font:'Georgia',size:52,color:'5A1E19'}},heading1:{run:{font:'Georgia',size:40,color:'5A1E19'},paragraph:{spacing:{after:120}}},heading2:{run:{font:'Georgia',size:30,color:'8A6A2B'},paragraph:{spacing:{before:240,after:120}}},heading3:{run:{font:'Georgia',size:26,bold:true},paragraph:{spacing:{before:200,after:80}}}}},
      sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:ch}]});
    const blob=await D.Packer.toBlob(doc);
    const fname=((all?'Легенды — '+S.hero.title:'Легенда — '+list[0].r.name).replace(/[\\/:*?"<>|]+/g,' ').trim())+'.docx';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    st('Файл Word скачан');
  }catch(e){console.error(e);st('Не получилось собрать файл Word. Проверьте интернет и попробуйте ещё раз.')}
}

function gwNeed(c){return Math.max(0,Math.floor(+c.need||0))}

function gwRewardDefs(){const seen=new Set(),out=[];S.teams.forEach(t=>gwDefs(t.id,!!pin).forEach(c=>{if(gwNeed(c)&&!seen.has(c.id)&&!c.off){seen.add(c.id);out.push(c)}}));

    PL.me=data.me;PL.boardAt=0;const now=achEarned(PL.me).filter(a=>!before.ach.has(a.id));

      <td class="hf-n">${h(p.name)}${ach.length?`<span class="hf-ach">${ach.slice(-6).map(a=>`<i title="${h(a.name)}">${h(a.icon||'★')}</i>`).join('')}${ach.length>6?`<small>+${ach.length-6}</small>`:''}</span>`:''}</td>
      <td class="hf-w">${p.wins}</td><td>${p.losses}</td><td class="hf-x">${p.games}</td><td class="hf-x">${pct}%</td><td class="hf-x">${p.best_streak}</td>
      ${ed?`<td class="hf-ed"><button class="btn small" data-gwadm="rename" data-u="${p.id}" data-n="${h(p.name)}">Имя</button><button class="btn small" data-gwadm="reset" data-u="${p.id}">${ui.gwAdm==='reset'+p.id?'Точно обнулить?':'Обнулить'}</button><button class="btn small danger" data-gwadm="delete" data-u="${p.id}">${ui.gwAdm==='delete'+p.id?'Точно убрать?':'Убрать'}</button></td>`:''}</tr>`};
  return `<div class="gw-hall">${head}
    ${B.length?`<div class="gw-htab-w"><table class="gw-htab"><thead><tr><th>#</th><th>Игрок</th><th title="Победы">Победы</th><th title="Поражения">Пор.</th><th class="hf-x">Партий</th><th class="hf-x">% побед</th><th class="hf-x" title="Лучшая серия побед">Серия</th>${ed?'<th></th>':''}</tr></thead>
      <tbody>${B.map(row).join('')}</tbody></table></div>`:'<p class="empty">В таблице пока никого. Станьте первым!</p>'}
    <p class="hint">Считаются партии против компьютера. Место — по числу побед, при равенстве выше тот, у кого меньше поражений.${ed?' Режим мастера: можно поправить имя, обнулить счёт или убрать игрока.':''}</p>
    <div class="gw-hall-foot"><button class="btn small" id="gw-hall-reload">Обновить</button></div></div>`;
}
function gwAchPage(){
  const ed=!!(ui.edit&&pin),p=PL.me,L=achList(),done=L.filter(a=>achDone(p,a)).length,R=gwRewardDefs();
  const achCard=(a,i)=>{const v=Math.min(achVal(p,a),achN(a)),ok=achDone(p,a);
    return `<div class="ach${ok?' on':''}"><span class="ach-ic">${h(a.icon||'★')}</span><div class="ach-b"><b>${h(a.name||'Достижение')}</b><span>${h(achDesc(a))}</span>
      ${ok?'<em>Получено</em>':achN(a)>1?`<span class="ach-bar"><i style="width:${Math.round(v/achN(a)*100)}%"></i></span><small>${v} / ${achN(a)}</small>`:''}</div>
      ${ed?`<button class="btn small" data-achedit="${i}">Изменить</button>`:''}</div>`};
  const opt=(arr,val)=>arr.map(([v,l])=>`<option value="${h(v)}"${String(val)===String(v)?' selected':''}>${h(l)}</option>`).join('');
  const ea=ed&&ui.achEd!==undefined&&achEdit()[ui.achEd];
  const editor=ea?`<div class="ach-ed"><div class="gw-mf">
      <label>Значок<input data-ach="icon" value="${h(ea.icon||'')}" maxlength="4"></label>
      <label class="gw-mf-w">Название<input data-ach="name" value="${h(ea.name||'')}" maxlength="40"></label>
      <label class="gw-mf-w">Условие<select data-ach="type">${opt(ACH_TYPES,ea.type)}</select></label>
      ${ea.type==='faction'?`<label class="gw-mf-w">Фракция<select data-ach="arg">${opt(S.teams.map(t=>[t.id,t.name]),ea.arg)}</select></label>`:''}
      ${ea.type==='vs'?`<label class="gw-mf-w">Против фракции<select data-ach="arg">${opt(S.teams.map(t=>[t.id,t.name]),ea.arg)}</select></label>`:''}
      ${ea.type==='pair'?`<label class="gw-mf-w">Играя за<select data-ach="argF">${opt(S.teams.map(t=>[t.id,t.name]),String(ea.arg||'').split('>')[0])}</select></label><label class="gw-mf-w">Против<select data-ach="argO">${opt(S.teams.map(t=>[t.id,t.name]),String(ea.arg||'').split('>')[1])}</select></label>`:''}
      ${ea.type==='feat'?`<label class="gw-mf-w">Розыгрыш<select data-ach="arg">${opt(Object.entries(FEATS),ea.arg)}</select></label>`:''}
      <label class="gw-mf-w">Раздел<select data-ach="grp">${opt(ACH_GRP.map(g=>[g,g]),ea.grp||'Общие')}</select></label>
      ${ea.type==='special'?`<label class="gw-mf-w">Особая карта<select data-ach="arg">${opt(Object.keys(GW_SP).map(k=>[k,((gwData().spMeta||{})[k]||{}).name||GW_SP[k].name]),ea.arg)}</select></label>`:''}
      <label>Сколько<input type="number" data-ach="n" min="1" max="999" value="${achN(ea)}"></label>
      <label class="gw-mf-w">Описание (можно оставить пустым)<input data-ach="desc" value="${h(ea.desc||'')}" maxlength="120" placeholder="${h(achDesc(Object.assign({},ea,{desc:''})))}"></label></div>
    <div class="gw-mact"><button class="btn small danger" id="ach-del">${ui.achDel?'Точно удалить?':'Удалить достижение'}</button><span class="grow"></span><button class="btn small gold" id="ach-done">Готово</button></div></div>`:'';
  return `<div class="gw-achp">
    <div class="gw-ach-head"><h3>Достижения</h3><span>${p?`Получено ${done} из ${L.length}`:'Войдите, чтобы собирать достижения'}</span></div>
    ${editor}
    ${ACH_GRP.map(gn=>{const idx=L.map((a,i)=>[a,i]).filter(([a])=>(ACH_GRP.includes(a.grp)?a.grp:'Общие')===gn);if(!idx.length&&!(ed&&gn==='Общие'))return '';const got=p?idx.filter(([a])=>achDone(p,a)).length:0;
      return `<div class="ach-gh"><span>${gn}</span><small>${p?got+' / '+idx.length:idx.length}</small></div><div class="ach-grid">${idx.map(([a,i])=>achCard(a,i)).join('')}${ed&&gn==='Общие'?'<button class="gw-addc ach-add" id="ach-add"><span>+</span>Новое достижение</button>':''}</div>`}).join('')}
    ${ed?`<div class="gw-mtools"><button class="btn small" id="ach-reset">Вернуть стандартные достижения</button></div>`:''}
    <div class="gw-ach-head"><h3>Наградные карты</h3><span>Открываются за победы${p?` · у вас ${p.wins}`:''}</span></div>
    ${R.length?`<div class="gw-rgrid">${R.map(c=>{const lk=gwNeed(c)>plWins();return `<div class="gw-rc${lk?' locked':''}">${gwCard(c,{name:true,tip:true,attrs:`data-gwopen="${h(c.id)}" role="button" tabindex="0"`})}
      <span class="gw-rc-n">${lk?`🔒 после ${gwNeed(c)} ${plural(gwNeed(c),'победы','побед','побед')}`:'★ открыта'}</span><span class="gw-rc-f">${h(c.sub||'')}</span></div>`}).join('')}</div>`
      :`<p class="empty">${ed?'Наградных карт пока нет. Откройте любую карту во вкладке «Колода» и укажите, после скольких побед она открывается.':'Мастер ещё не назначил наградные карты.'}</p>`}
  </div>`;
}
function gwHallClick(t,ds){
  if(ds.gwpage){ui.gwPage=ds.gwpage;ui.achEd=undefined;if(ds.gwpage==='hall')plLoadBoard(true);render();return true}
  if(t.id==='gw-hall-reload'){plLoadBoard(true);return true}
  if(ds.gwadm&&pin){const u=ds.u,a=ds.gwadm;let nm=null;
    if(a==='rename'){nm=prompt('Новое имя игрока',ds.n||'');if(!nm||!nm.trim())return true}
    else if(ui.gwAdm!==a+u){ui.gwAdm=a+u;render();return true}
    ui.gwAdm=null;sb.rpc('gw_admin',{p_pin:pin,p_action:a,p_user:u,p_name:nm}).then(({data,error})=>{if(error||!data)toast(error?plErr(error):'Не получилось');else{toast(a==='delete'?'Игрок убран из таблицы':a==='reset'?'Счёт обнулён':'Имя изменено');if(PL.me&&PL.me.id===u)plLoadMe()}plLoadBoard(true)});return true}
  if(ds.achedit!==undefined){ui.achEd=+ds.achedit;ui.achDel=false;render();return true}
  if(t.id==='ach-add'){const L=achEdit();L.push({id:uid('a'),icon:'★',name:'Новое достижение',type:'wins',n:10});ui.achEd=L.length-1;ui.achDel=false;soft();render();return true}
  if(t.id==='ach-done'){ui.achEd=undefined;render();return true}
  if(t.id==='ach-del'){if(!ui.achDel){ui.achDel=true;render();return true}achEdit().splice(ui.achEd,1);ui.achEd=undefined;ui.achDel=false;soft();render();return true}
  if(t.id==='ach-reset'){gwData().ach=achDefaults();ui.achEd=undefined;soft();render();return true}
  return false;
}
function gwHallChange(t){const f=t.dataset&&t.dataset.ach;if(!f)return false;const a=achEdit()[ui.achEd];if(!a)return true;
  if(f==='argF'||f==='argO'){const q=String(a.arg||'').split('>');q[f==='argF'?0:1]=t.value;a.arg=q[0]+'>'+(q[1]||'');soft();render();return true}
  a[f]=f==='n'?Math.max(1,Math.min(999,Math.floor(+t.value||1))):t.value;
  if(f==='type'){const t0=(S.teams[0]||{}).id||'',t1=(S.teams[1]||S.teams[0]||{}).id||'';a.arg=a.type==='faction'||a.type==='vs'?t0:a.type==='pair'?t0+'>'+t1:a.type==='special'?'dragon':a.type==='feat'?'close1':undefined;if(a.arg===undefined)delete a.arg}
  soft();render();return true}

/* the player modal */
function plModal(m,wrap){
  const st=m.step,err=m.err?`<p class="err">${h(m.err)}</p>`:'<p class="err"></p>';
  if(st==='hello')return wrap(`<h2 id="m-h">Добро пожаловать в Вестерос</h2>
    <p class="pl-lead">Представьтесь — и в «Игре знамён» начнётся ваш счёт побед: турнирная таблица, достижения и особые карты, которые открываются победителям.</p>
    <form id="pl-form" data-step="hello"><div class="field"><label for="pl-name">Ваше имя в турнирной таблице</label><input id="pl-name" maxlength="24" autocomplete="nickname" value="${h(m.name||'')}" required></div>
    <div class="field"><label for="pl-email">Почта</label><input id="pl-email" type="email" autocomplete="email" inputmode="email" value="${h(m.email||'')}" required><span class="hint">Пришлём письмо с кодом для входа. Пароль не нужен. Почту никто, кроме вас, не увидит.</span></div>
    ${err}<div class="foot"><span class="grow"></span><button type="button" class="btn" id="m-cancel">Позже</button><button type="submit" class="btn primary"${m.busy?' disabled':''}>${m.busy?'Отправляю…':'Получить код'}</button></div></form>`);
  if(st==='code')return wrap(`<h2 id="m-h">Проверьте почту</h2>
    <p class="pl-lead">Мы отправили письмо на <b>${h(m.email)}</b>. Введите код из письма — или просто нажмите в письме на ссылку для входа.</p>
    <form id="pl-form" data-step="code"><div class="field"><label for="pl-code">Код из письма</label><input id="pl-code" class="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></div>
    ${err}<div class="foot"><button type="button" class="btn small" id="pl-back">Другая почта</button><button type="button" class="btn small" id="pl-resend"${m.busy?' disabled':''}>Отправить ещё раз</button><span class="grow"></span><button type="submit" class="btn primary"${m.busy?' disabled':''}>${m.busy?'Проверяю…':'Войти'}</button></div></form>
    <p class="hint">Письма нет? Загляните в «Спам» и «Промоакции».</p>`);
  if(st==='name')return wrap(`<h2 id="m-h">${PL.me?'Сменить имя':'Как вас зовут?'}</h2>
    <form id="pl-form" data-step="name"><div class="field"><label for="pl-name">Имя в турнирной таблице</label><input id="pl-name" maxlength="24" autocomplete="nickname" value="${h(m.name||(PL.me?PL.me.name:''))}" required></div>
    ${err}<div class="foot">${PL.me?'':'<button type="button" class="btn small" id="pl-out">Выйти</button>'}<span class="grow"></span><button type="button" class="btn" id="${PL.me?'pl-prof':'m-cancel'}">${PL.me?'Назад':'Позже'}</button><button type="submit" class="btn primary"${m.busy?' disabled':''}>Сохранить</button></div></form>`);
  // profile
  const p=PL.me;if(!p)return wrap(`<h2 id="m-h">Профиль</h2><p class="empty">Загружаю…</p><div class="foot"><span class="grow"></span><button class="btn" id="m-cancel">Закрыть</button></div>`);
  const pos=PL.board?PL.board.findIndex(x=>x.id===p.id)+1:0,ach=achEarned(p),R=gwRewardDefs(),open=R.filter(c=>gwNeed(c)<=p.wins).length,nx=R.find(c=>gwNeed(c)>p.wins);
  const S2=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`;
  return wrap(`<h2 id="m-h">${h(p.name)}</h2><p class="hint" style="margin-top:-6px">${h(PL.session&&PL.session.user&&PL.session.user.email||'')}</p>
    <div class="pl-stats">${S2(pos?'#'+pos:'—','место')}${S2(p.wins,plural(p.wins,'победа','победы','побед'))}${S2(p.losses,plural(p.losses,'поражение','поражения','поражений'))}${S2(p.best_streak,'лучшая серия')}</div>
    <div class="pl-sec"><span class="lbl">Достижения · ${ach.length} из ${achList().length}</span><div class="pl-ach">${ach.length?ach.map(a=>`<span title="${h(achDesc(a))}"><i>${h(a.icon||'★')}</i>${h(a.name)}</span>`).join(''):'<em>Пока нет — одержите первую победу!</em>'}</div></div>
    ${R.length?`<div class="pl-sec"><span class="lbl">Наградные карты · открыто ${open} из ${R.length}</span><p class="hint" style="margin:4px 0 0">${nx?`Следующая — «${h(nx.name)}» — через ${gwNeed(nx)-p.wins} ${plural(gwNeed(nx)-p.wins,'победу','победы','побед')}.`:'Все наградные карты открыты!'}</p></div>`:''}
    <div class="foot"><button class="btn small" id="pl-out">Выйти</button><button class="btn small" id="pl-rename">Сменить имя</button><span class="grow"></span><button class="btn small gold" data-plhall="1">Зал славы</button><button class="btn" id="m-cancel" data-x="1">Закрыть</button></div>`);
}
async function plSend(email,resend){const m=ui.modal;m.busy=true;m.err='';render();
  const {error}=await sbu.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  m.busy=false;if(error){m.err=plErr(error);render();return}
  m.step='code';m.email=email;if(resend)m.err='Новое письмо отправлено.';render();setTimeout(()=>document.getElementById('pl-code')?.focus(),30);
}
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='pl-form')return;ev.preventDefault();const m=ui.modal;if(!m||m.kind!=='player'||m.busy)return;
  const st=ev.target.dataset.step;
  if(st==='hello'){const name=document.getElementById('pl-name').value.trim().replace(/\s+/g,' '),email=document.getElementById('pl-email').value.trim();m.name=name;m.email=email;
    if(name.length<2||name.length>24){m.err=NAME_ERR.bad_name;render();return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.err='Проверьте адрес почты.';render();return}
    try{localStorage.setItem('vpv-pl-name',name)}catch(_){}
    plSend(email);return}
  if(st==='code'){const code=document.getElementById('pl-code').value.replace(/\D/g,'');if(code.length<6){m.err='В коде из письма 6 цифр (или больше).';render();return}
    m.busy=true;m.err='';render();
    let r=await sbu.auth.verifyOtp({email:m.email,token:code,type:'email'});
    if(r.error)r=await sbu.auth.verifyOtp({email:m.email,token:code,type:'signup'}).then(x=>x.error?r:x);
    m.busy=false;if(r.error){m.err=plErr(r.error);render();return}
    m.err='';render();return} // onAuthStateChange finishes the job
  if(st==='name'){const name=document.getElementById('pl-name').value.trim().replace(/\s+/g,' ');m.name=name;m.busy=true;m.err='';render();
    const {data,error}=await sbu.rpc('gw_set_name',{p_name:name});m.busy=false;
    if(error||!data||!data.ok){m.err=error?plErr(error):NAME_ERR[data&&data.code]||'Не получилось.';render();return}
    const first=!PL.me;PL.me=data.me;PL.boardAt=0;try{localStorage.removeItem('vpv-pl-name')}catch(_){}
    ui.modal=first?null:{kind:'player',step:'profile'};render();toast(first?'Добро пожаловать, '+PL.me.name+'!':'Имя изменено');return}
});
function plClick(t){
  if(t.dataset.plopen){plOpen();return true}
  if(t.dataset.plhall){ui.modal=null;ui.tab='banners';ui.gw='menu';GM=null;ui.gwPage='hall';plLoadBoard(true);render();window.scrollTo(0,0);return true}
  const m=ui.modal;if(!m||m.kind!=='player')return false;
  if(t.id==='pl-back'){m.step='hello';m.err='';render();return true}
  if(t.id==='pl-resend'){plSend(m.email,true);return true}
  if(t.id==='pl-rename'){ui.modal={kind:'player',step:'name',name:PL.me?PL.me.name:''};render();document.getElementById('pl-name')?.select();return true}
  if(t.id==='pl-prof'){ui.modal={kind:'player',step:'profile'};render();return true}
  if(t.id==='pl-out'){ui.modal=null;sbu.auth.signOut().then(()=>{PL.me=null;PL.session=null;render();toast('Вы вышли из профиля')});return true}
  return false;
}
/* a small leaderboard on the front page */
function hallMini(){
  if(ui.edit)return '';plLoadBoard();const B=PL.board;if(!B||!B.length&&!PL.me)return B&&!B.length?`<div class="hall-mini"><div class="hall-mini-h"><h3>Зал славы «Игры знамён»</h3><button class="btn small gold" ${PL.me?'data-plhall="1"':'data-plopen="1"'}>${PL.me?'Открыть':'Войти и сыграть'}</button></div><p class="hint">Таблица пока пуста — станьте первым победителем.</p></div>`:'';
  const myId=PL.me&&PL.me.id,top=B.slice(0,5),pos=myId?B.findIndex(p=>p.id===myId):-1;
  return `<div class="hall-mini"><div class="hall-mini-h"><h3>Зал славы «Игры знамён»</h3><button class="btn small gold" data-plhall="1">Вся таблица</button></div>
    <ol>${top.map((p,i)=>`<li class="${p.id===myId?'me':''}"><span class="hm-p">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="hm-n">${h(p.name)}</span><span class="hm-w">${p.wins} ${plural(p.wins,'победа','победы','побед')}</span></li>`).join('')}
    ${pos>=5?`<li class="me gap"><span class="hm-p">${pos+1}</span><span class="hm-n">${h(B[pos].name)}</span><span class="hm-w">${B[pos].wins} ${plural(B[pos].wins,'победа','победы','побед')}</span></li>`:''}</ol>
    ${PL.me?'':'<p class="hint">Войдите, чтобы ваши победы попали в таблицу. <button class="btn small" data-plopen="1">Войти</button></p>'}</div>`;
}

/* ---------------- boot ---------------- */
const hash=(location.hash||'').slice(1);
if(tabs().some(([k])=>k===hash))ui.tab=hash;
render();
sb.from('site_content').select('data').eq('id',1).maybeSingle().then(({data,error})=>{
  if(error){ui.loadErr=true}
  else if(data&&data.data){S=Object.assign({hero:{eyebrow:'',title:'',text:''},about:'',lore:[],rules:[],teams:[],roles:[],map:{}},data.data);saved=JSON.stringify(S)}
  ui.loading=false;render();
  sb.rpc('list_pinned_roles').then(({data,error})=>{if(!error&&Array.isArray(data)){PINNED=new Set(data);render()}});
  const ids=photoIds();
  // photos in small batches: the page fills in quickly instead of waiting for one huge response
  if(ids.length){const B=12,parts=[];for(let i=0;i<ids.length;i+=B)parts.push(ids.slice(i,i+B));let rt=0;
    const flush=()=>{if(!rt)rt=setTimeout(()=>{rt=0;render()},150)};
    let k=0;const next=()=>{const part=parts[k++];if(!part)return;sb.from('role_photos').select('id,data').in('id',part).then(({data})=>{(data||[]).forEach(p=>photos[p.id]=p.data);flush();next()},next)};
    for(let n=0;n<4;n++)next();}
});
})();
