<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игра Престолов: Вой по волку</title>
<meta name="description" content="Ролевая игра живого действия «Игра Престолов: Вой по волку»: об игре, лор и сетка ролей.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style id="app-style">
/* Layout: narrow chronicle column; header with sigil-line tabs; lore = left index + reading pane; roles = team bands of portrait cards */
:root{
  --bg:#111316; --surface:#1a1d21; --raised:#22262b; --line:#30353c;
  --fg:#ddd6c6; --muted:#8e8a80; --frost:#93aabb; --wax:#a5432f; --wax-hi:#c2563f;
  --ok:#7f9f6e;
  --display:"Cormorant SC","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"PT Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 120px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.02em;text-wrap:balance;line-height:1.15;margin:0}
a{color:var(--frost)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--frost);outline-offset:2px}

/* hero */
.hero{display:grid;gap:14px;padding-block:22px 26px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.18em;color:var(--frost)}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:700}
.hero .lead{max-width:62ch;color:var(--fg);margin:0}
.hero .lead p{margin:0 0 .7em}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-block:18px 28px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 9px;margin-bottom:-1px;
  font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:.04em}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--wax)}
.tabs .spacer{flex:1}
.master-toggle{align-self:center;background:none;border:1px solid var(--line);border-radius:3px;color:var(--muted);
  padding:5px 12px;font-size:14px;cursor:pointer}
.master-toggle[aria-pressed="true"]{border-color:var(--wax);color:var(--fg);background:color-mix(in srgb,var(--wax) 18%,transparent)}

/* prose */
.prose{max-width:66ch}
.prose h3{font-size:28px;margin:1.4em 0 .4em;color:var(--fg)}
.prose h4{font-size:22px;margin:1.2em 0 .3em;color:var(--frost)}
.prose h3:first-child,.prose h4:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1em;padding-left:1.2em}
.prose li{margin-bottom:.3em}
.prose strong{color:#efe8d7}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:3px;
  padding:7px 14px;font-size:15px;cursor:pointer;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--wax);border-color:var(--wax);color:#fff}
.btn.primary:hover{background:var(--wax-hi)}
.btn.danger{color:#e3a094;border-color:color-mix(in srgb,var(--wax) 60%,var(--line))}
.btn.small{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.edit-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* fields */
.field{display:grid;gap:4px;margin-bottom:14px}
.field label{font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.field input,.field textarea,.field select,textarea.inline{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
textarea.inline{min-height:160px;line-height:1.55;resize:vertical}
.hint{font-size:13px;color:var(--muted)}

/* lore */
.lore{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.lore-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:2px;
  border-left:1px solid var(--line);padding-left:2px;max-height:80vh;overflow:auto}
.lore-item{display:flex;align-items:center;gap:4px}
.lore-link{flex:1;min-width:0;text-align:left;background:none;border:0;border-left:2px solid transparent;margin-left:-3px;
  padding:7px 10px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1.3}
.lore-link:hover{color:var(--fg)}
.lore-link[aria-current="true"]{color:var(--fg);border-left-color:var(--wax);background:var(--surface)}
.lore-item .mv{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:12px}
.lore-article h2{font-size:38px;margin-bottom:16px}
.empty{color:var(--muted);font-style:italic}

/* roles */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);background:none;border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--frost);background:color-mix(in srgb,var(--frost) 14%,transparent)}
.team{margin-bottom:40px}
.team-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.team-head h2{font-size:32px}
.team-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.team-head .actions{margin-left:auto;display:flex;gap:6px}
.team-desc{color:var(--muted);margin:0 0 16px;max-width:66ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.portrait{aspect-ratio:3/4;max-width:100%;background:linear-gradient(160deg,var(--raised),var(--bg));display:grid;place-items:center;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .initial{font-family:var(--display);font-size:72px;color:var(--line)}
.card-body{padding:12px 14px 14px;display:grid;gap:6px;flex:1;align-content:start}
.card h3{font-size:23px}
.card .rtitle{font-size:14px;color:var(--frost);font-style:italic;margin-top:-4px}
.card p{margin:0;font-size:15px;line-height:1.5}
.status{justify-self:start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:2px 7px;margin-top:4px}
.status.free{color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent)}
.status.taken{color:var(--muted);border:1px solid var(--line)}
.card-tools{display:flex;gap:4px;padding:0 14px 12px}
.add-card{border:1px dashed var(--line);border-radius:4px;background:none;color:var(--muted);cursor:pointer;min-height:180px;font-size:16px}
.add-card:hover{color:var(--fg);border-color:var(--muted)}

/* master bar & modal */
.notice{border:1px dashed var(--line);padding:8px 12px;border-radius:3px;color:var(--muted);font-size:14px;margin-bottom:20px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--raised);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:20}
.savebar .msg{flex:1;min-width:180px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:4px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h2{font-size:28px;margin-bottom:16px}
.modal .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.modal .foot .grow{flex:1}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .thumb{width:72px;aspect-ratio:3/4;border:1px solid var(--line);border-radius:3px;background:var(--bg);overflow:hidden;flex:none}
.photo-pick .thumb img{width:100%;height:100%;object-fit:cover}

@media (max-width:720px){
  .lore{grid-template-columns:1fr;gap:16px}
  .lore-nav{position:static;display:flex;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);max-height:none;padding:0}
  .lore-item{flex:none}
  .lore-link{border-left:0;border-bottom:2px solid transparent;margin:0 0 -1px;white-space:nowrap}
  .lore-link[aria-current="true"]{border-bottom-color:var(--wax);background:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tab{font-size:18px;padding:8px 10px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.foot-links{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.err{color:#e3a094;font-size:14px;min-height:1.2em}
</style>

<script type="application/json" id="state">{"hero":{"eyebrow":"Ролевая игра живого действия","title":"Игра Престолов: Вой по волку","text":"Север после смерти короля. Знамёна созваны, вороны летят во все стороны, а в лесах под Винтерфеллом снова слышен волчий вой. Игра о верности, крови и цене данного слова.\n\n*Текст-пример. Включите режим мастера, чтобы заменить его.*"},"about":"## Когда и где\n- **Даты:** [укажите даты игры]\n- **Место:** [полигон, область]\n- **Заезд:** [время заезда и парада]\n\n## Формат\nИгра на [число] игроков, около [число] дней. Основные линии: политика Великих домов, война на Перешейке и тайны Старых богов.\n\n## Взнос\n[Размер взноса, сроки оплаты, что в него входит.]\n\n## Как подать заявку\nВыберите роль в разделе «Сетка ролей» и напишите мастерам: [контакт].","lore":[{"id":"l1","title":"Север","body":"Самый большой из Семи королевств и самый пустой. Зимы здесь длятся годами, а лорды помнят обиды веками.\n\n## Старые боги\nСеверяне молятся сердце-деревьям в богорощах и клянутся перед ними. Клятва, данная у чардрева, считается нерушимой."},{"id":"l2","title":"Дом Старков","body":"Хранители Севера, правившие из Винтерфелла тысячи лет. Девиз: **«Зима близко»**. Герб: серый лютоволк на белом поле."},{"id":"l3","title":"Хронология до игры","body":"- Смерть короля в Королевской Гавани.\n- Северные лорды созывают знамёна.\n- Железные люди замечены у Каменного берега.\n\n*Добавьте свои события.*"}],"teams":[{"id":"t1","name":"Дом Старков","desc":"Винтерфелл и верные ему знаменосцы."},{"id":"t2","name":"Дом Болтонов","desc":"Дредфорт. Терпение и содранная кожа."},{"id":"t3","name":"Ночной Дозор","desc":"Чёрные братья на Стене."}],"roles":[{"id":"r1","team":"t1","name":"Лорд Винтерфелла","title":"Хранитель Севера","text":"Глава дома. Должен удержать знаменосцев вместе, когда каждый тянет в свою сторону.","player":"","photo":""},{"id":"r2","team":"t1","name":"Мейстер","title":"Советник замка","text":"Вороны, лекарства и знание, которое опаснее меча.","player":"","photo":""},{"id":"r3","team":"t2","name":"Лорд Дредфорта","title":"Знаменосец Старков","text":"Клялся Винтерфеллу. Пока.","player":"","photo":""},{"id":"r4","team":"t3","name":"Лорд-командующий","title":"Ночной Дозор","text":"Держит Стену с горсткой людей и знает, что за ней.","player":"","photo":""}]}</script>
<script id="app-script">
(function(){
const SB_URL='https://osteatakzwgqvsmsauls.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zdGVhdGFrendncXZzbXNhdWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTM0MzQsImV4cCI6MjEwNzg2OTQzNH0.pMWIE_sNH-G4BYDou-2wZ7iVtLOSlsAVGMPnDkxxAl4', MASTER='vladislav.veryn@gmail.com';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const SRC = document.getElementById('state').textContent;
let S = JSON.parse(SRC);
let saved = SRC;
let ui = {tab:'about', lore:null, filter:'all', master:false, canEdit:false, readOnly:false, saving:false, modal:null};
let session=null, loading=true;

const TABS = [['about','Об игре'],['lore','Лор игры'],['roles','Сетка ролей']];
const h = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p)=>p+Math.random().toString(36).slice(2,9);
const dirty = ()=>JSON.stringify(S)!==saved;

function inline(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(text){
  const blocks = h(text||'').split(/\n\s*\n/);
  return blocks.map(b=>{
    b=b.trim(); if(!b) return '';
    if(b.startsWith('### ')) return '<h4>'+inline(b.slice(4))+'</h4>';
    if(b.startsWith('## ')){const [first,...rest]=b.split('\n');return '<h3>'+inline(first.slice(3))+'</h3>'+(rest.length?md(rest.join('\n')):'')}
    const lines=b.split('\n');
    if(lines.every(l=>/^\s*-\s/.test(l))) return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*-\s/,''))+'</li>').join('')+'</ul>';
    return '<p>'+inline(lines.join('<br>'))+'</p>';
  }).join('');
}
const MD_HINT='Разметка: пустая строка — новый абзац, «## » — заголовок, «- » — пункт списка, **жирный**, *курсив*.';

/* ---------- render ---------- */
function render(){
  const root=document.getElementById('root');
  const m=ui.master;
  let html='<div class="wrap">';
  html+='<header class="hero">';
  if(m){
    html+=`<div class="field"><label for="f-eyebrow">Подзаголовок</label><input id="f-eyebrow" data-bind="hero.eyebrow" value="${h(S.hero.eyebrow)}"></div>
    <div class="field"><label for="f-title">Название игры</label><input id="f-title" data-bind="hero.title" value="${h(S.hero.title)}"></div>
    <div class="field"><label for="f-herotext">Описание игры</label><textarea class="inline" id="f-herotext" data-bind="hero.text" style="min-height:120px">${h(S.hero.text)}</textarea><span class="hint">${MD_HINT}</span></div>`;
  }else{
    html+=`<div class="eyebrow">${h(S.hero.eyebrow)}</div><h1>${h(S.hero.title)}</h1><div class="lead">${md(S.hero.text)}</div>`;
  }
  html+='</header>';
  html+='<nav class="tabs" role="tablist">'+TABS.map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${ui.tab===k}" data-tab="${k}">${l}</button>`).join('');
  html+='<span class="spacer"></span>';
  if(ui.canEdit) html+=`<button class="master-toggle" id="master-toggle" aria-pressed="${m}">${m?'Режим мастера: вкл':'Режим мастера'}</button>`;
  html+='</nav>';
  if(m) html+='<div class="notice">Вы редактируете сайт. Изменения увидят игроки после кнопки «Сохранить» внизу.</div>';
  html+='<main>'+(loading?'<p class="empty">Загружаю…</p>':ui.tab==='about'?renderAbout():ui.tab==='lore'?renderLore():renderRoles())+'</main>';
  html+='<footer class="foot-links">'+(session?`<span>Вы вошли: ${h(session.user.email)}</span><button class="linkbtn" id="logout">Выйти</button>`+(ui.canEdit?'':'<span>У этого аккаунта нет прав мастера.</span>'):'<button class="linkbtn" id="login-open">Вход для мастера</button>')+'</footer></div>';
  if(m && (dirty()||ui.saving)) html+=`<div class="savebar"><span class="msg">${ui.saving?'Сохраняю…':(ui.err||'Есть несохранённые изменения')}</span><button class="btn" id="discard" ${ui.saving?'disabled':''}>Отменить</button><button class="btn primary" id="save" ${ui.saving?'disabled':''}>Сохранить</button></div>`;
  if(ui.modal) html+=renderModal();
  const active=document.activeElement, aid=active&&active.id, sel=active&&('selectionStart' in active)?[active.selectionStart,active.selectionEnd]:null;
  root.innerHTML=html;
  if(aid){const el=document.getElementById(aid); if(el){el.focus(); if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
}

function renderAbout(){
  if(ui.master) return `<div class="field"><label for="f-about">Текст вкладки «Об игре»</label><textarea class="inline" id="f-about" data-bind="about" style="min-height:360px">${h(S.about)}</textarea><span class="hint">${MD_HINT}</span></div>`;
  return `<article class="prose">${md(S.about)||'<p class="empty">Пока пусто.</p>'}</article>`;
}

function renderLore(){
  if(!S.lore.find(a=>a.id===ui.lore)) ui.lore=S.lore[0]?.id||null;
  const a=S.lore.find(x=>x.id===ui.lore);
  let nav=S.lore.map((x,i)=>`<div class="lore-item"><button class="lore-link" data-lore="${x.id}" aria-current="${x.id===ui.lore}">${h(x.title)||'Без названия'}</button>${ui.master?`<button class="mv" data-lmove="${i}" data-dir="-1" aria-label="Выше">▲</button><button class="mv" data-lmove="${i}" data-dir="1" aria-label="Ниже">▼</button>`:''}</div>`).join('');
  if(ui.master) nav+=`<div class="lore-item"><button class="btn small" id="lore-add" style="margin:8px 10px">+ Статья</button></div>`;
  let body;
  if(!a) body='<p class="empty">Статей пока нет.</p>';
  else if(ui.master) body=`<div class="field"><label for="f-ltitle">Заголовок статьи</label><input id="f-ltitle" data-lbind="title" value="${h(a.title)}"></div>
    <div class="field"><label for="f-lbody">Текст статьи</label><textarea class="inline" id="f-lbody" data-lbind="body" style="min-height:340px">${h(a.body)}</textarea><span class="hint">${MD_HINT}</span></div>
    <div class="edit-row"><button class="btn danger" id="lore-del" data-confirm="${ui.confirmLore===a.id}">${ui.confirmLore===a.id?'Точно удалить статью?':'Удалить статью'}</button></div>`;
  else body=`<article class="lore-article prose"><h2>${h(a.title)}</h2>${md(a.body)}</article>`;
  return `<div class="lore"><nav class="lore-nav" aria-label="Статьи">${nav}</nav><div>${body}</div></div>`;
}

function renderRoles(){
  const teams=S.teams;
  let html='<div class="filters">'+[['all','Все']].concat(teams.map(t=>[t.id,t.name])).map(([id,n])=>`<button class="chip" data-filter="${id}" aria-pressed="${ui.filter===id}">${h(n)}</button>`).join('')+'</div>';
  const shown=ui.filter==='all'?teams:teams.filter(t=>t.id===ui.filter);
  for(const t of shown){
    const rs=S.roles.filter(r=>r.team===t.id);
    const free=rs.filter(r=>!r.player).length;
    html+=`<section class="team"><div class="team-head"><h2>${h(t.name)}</h2><span class="team-count">${rs.length} ${plural(rs.length,'роль','роли','ролей')} · свободно ${free}</span>`;
    if(ui.master) html+=`<span class="actions"><button class="btn small" data-team-edit="${t.id}">Изменить команду</button></span>`;
    html+='</div>';
    if(t.desc) html+=`<p class="team-desc">${h(t.desc)}</p>`;
    html+='<div class="grid">';
    rs.forEach(r=>{html+=renderCard(r)});
    if(ui.master) html+=`<button class="add-card" data-role-add="${t.id}">+ Добавить персонажа</button>`;
    else if(!rs.length) html+='<p class="empty">Роли ещё не добавлены.</p>';
    html+='</div></section>';
  }
  if(ui.master) html+=`<button class="btn" id="team-add">+ Новая команда</button>`;
  if(!teams.length && !ui.master) html+='<p class="empty">Сетка ролей пока пуста.</p>';
  return html;
}
function plural(n,a,b,c){const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c}
function renderCard(r){
  const ph=r.photo?`<img src="${h(r.photo)}" alt="${h(r.name)}" loading="lazy">`:`<span class="initial">${h((r.name||'?').trim()[0]||'?')}</span>`;
  const st=r.player?`<span class="status taken">Игрок: ${h(r.player)}</span>`:`<span class="status free">Роль свободна</span>`;
  let tools='';
  if(ui.master) tools=`<div class="card-tools"><button class="btn small" data-role-edit="${r.id}">Изменить</button><button class="btn small" data-rmove="${r.id}" data-dir="-1" aria-label="Левее">←</button><button class="btn small" data-rmove="${r.id}" data-dir="1" aria-label="Правее">→</button></div>`;
  return `<article class="card"><div class="portrait">${ph}</div><div class="card-body"><h3>${h(r.name)}</h3>${r.title?`<div class="rtitle">${h(r.title)}</div>`:''}<p>${h(r.text)}</p>${st}</div>${tools}</article>`;
}

function renderModal(){
  const md_=ui.modal;
  if(md_.kind==='login'){
    return `<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
    <h2 id="m-h">Вход для мастера</h2>
    <form id="login-form">
    <div class="field"><label for="m-email">Почта</label><input id="m-email" type="email" autocomplete="email" value="${h(md_.email||'')}" required></div>
    <div class="field"><label for="m-pass">Пароль</label><input id="m-pass" type="password" autocomplete="current-password" minlength="6" required></div>
    <p class="err" id="m-err">${h(md_.err||'')}</p>
    <div class="foot"><button type="button" class="btn" id="m-signup">Первый раз: создать аккаунт</button><span class="grow"></span><button type="button" class="btn" id="m-cancel">Отмена</button><button type="submit" class="btn primary">Войти</button></div>
    </form></div></div>`;
  }
  if(md_.kind==='role'){
    const d=md_.draft;
    return `<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
    <h2 id="m-h">${md_.isNew?'Новый персонаж':'Персонаж'}</h2>
    <div class="field"><label>Фотография</label><div class="photo-pick"><div class="thumb">${d.photo?`<img src="${h(d.photo)}" alt="">`:''}</div>
      <div style="display:grid;gap:6px"><input type="file" id="m-photo" accept="image/*"><span class="hint" id="m-photo-hint">${md_.uploading?'Загружаю фото…':md_.photoErr?'Не получилось загрузить фото. Попробуйте JPG или PNG.':'Фото уменьшится до 600 px автоматически.'}</span>${d.photo?'<button class="btn small" id="m-photo-clear" style="justify-self:start">Убрать фото</button>':''}</div></div></div>
    <div class="field"><label for="m-name">Имя персонажа</label><input id="m-name" data-d="name" value="${h(d.name)}"></div>
    <div class="field"><label for="m-title">Титул или должность</label><input id="m-title" data-d="title" value="${h(d.title)}"></div>
    <div class="field"><label for="m-text">Короткий текст</label><textarea id="m-text" data-d="text" rows="4">${h(d.text)}</textarea></div>
    <div class="field"><label for="m-team">Команда</label><select id="m-team" data-d="team">${S.teams.map(t=>`<option value="${t.id}" ${t.id===d.team?'selected':''}>${h(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-player">Игрок</label><input id="m-player" data-d="player" value="${h(d.player)}" placeholder="Пусто — роль свободна"></div>
    <div class="foot">${md_.isNew?'':`<button class="btn danger" id="m-del">${md_.confirm?'Точно удалить?':'Удалить'}</button>`}<span class="grow"></span><button class="btn" id="m-cancel">Отмена</button><button class="btn primary" id="m-ok" ${md_.uploading?'disabled':''}>Готово</button></div>
    </div></div>`;
  }
  const d=md_.draft, count=md_.isNew?0:S.roles.filter(r=>r.team===d.id).length;
  return `<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
    <h2 id="m-h">${md_.isNew?'Новая команда':'Команда'}</h2>
    <div class="field"><label for="m-tname">Название</label><input id="m-tname" data-d="name" value="${h(d.name)}"></div>
    <div class="field"><label for="m-tdesc">Описание</label><textarea id="m-tdesc" data-d="desc" rows="3">${h(d.desc)}</textarea></div>
    ${md_.isNew?'':`<div class="edit-row" style="margin-bottom:14px"><button class="btn small" data-tmove="-1">Выше</button><button class="btn small" data-tmove="1">Ниже</button></div>`}
    <div class="foot">${md_.isNew?'':`<button class="btn danger" id="m-del" ${count?'disabled title="Сначала перенесите или удалите персонажей"':''}>${md_.confirm?'Точно удалить?':'Удалить команду'}</button>`}<span class="grow"></span><button class="btn" id="m-cancel">Отмена</button><button class="btn primary" id="m-ok">Готово</button></div>
    ${count?`<p class="hint" style="margin-top:10px">Удалить команду можно, когда в ней нет персонажей (сейчас ${count}).</p>`:''}
  </div></div>`;
}

/* ---------- events ---------- */
function setPath(path,val){const ks=path.split('.');let o=S;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=val}
let renderTimer=null;
function softRender(){clearTimeout(renderTimer);renderTimer=setTimeout(updateSavebar,120)}
function updateSavebar(){
  const has=!!document.querySelector('.savebar');
  if(has!==(dirty()||ui.saving)) render();
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);softRender()}
  else if(t.dataset.lbind){const a=S.lore.find(x=>x.id===ui.lore); if(a){a[t.dataset.lbind]=t.value; if(t.dataset.lbind==='title'){const l=document.querySelector(`[data-lore="${a.id}"]`); if(l) l.textContent=t.value||'Без названия'} softRender()}}
  else if(t.dataset.d && ui.modal){ui.modal.draft[t.dataset.d]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.d && ui.modal) ui.modal.draft[t.dataset.d]=t.value;
  if(t.id==='m-photo' && t.files && t.files[0]) handlePhoto(t.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});

document.addEventListener('click',async e=>{
  const t=e.target.closest('button, .modal-bg'); if(!t) return;
  if(t.id==='modal-bg'){ if(e.target===t){ui.modal=null;render()} return }
  const ds=t.dataset;
  if(ds.tab){ui.tab=ds.tab; try{history.replaceState(null,'','#'+ds.tab)}catch(_){} render(); return}
  if(t.id==='master-toggle'){ui.master=!ui.master;ui.confirmLore=null;render();return}
  if(ds.lore){ui.lore=ds.lore;ui.confirmLore=null;render();return}
  if(ds.filter){ui.filter=ds.filter;render();return}
  if(t.id==='lore-add'){const a={id:uid('l'),title:'Новая статья',body:''};S.lore.push(a);ui.lore=a.id;render();document.getElementById('f-ltitle')?.select();return}
  if(t.id==='lore-del'){ if(ui.confirmLore===ui.lore){S.lore=S.lore.filter(x=>x.id!==ui.lore);ui.lore=null;ui.confirmLore=null}else ui.confirmLore=ui.lore; render(); return}
  if(ds.lmove!==undefined){move(S.lore,+ds.lmove,+ds.dir);render();return}
  if(ds.rmove){const team=S.roles.find(r=>r.id===ds.rmove).team;const idxs=S.roles.map((r,i)=>r.team===team?i:-1).filter(i=>i>=0);const pos=idxs.indexOf(S.roles.findIndex(r=>r.id===ds.rmove));const to=pos+(+ds.dir);if(to>=0&&to<idxs.length){const a=idxs[pos],b=idxs[to];[S.roles[a],S.roles[b]]=[S.roles[b],S.roles[a]]}render();return}
  if(ds.roleAdd){ui.modal={kind:'role',isNew:true,draft:{id:uid('r'),team:ds.roleAdd,name:'',title:'',text:'',player:'',photo:''}};render();document.getElementById('m-name')?.focus();return}
  if(ds.roleEdit){const r=S.roles.find(x=>x.id===ds.roleEdit);ui.modal={kind:'role',isNew:false,draft:{...r}};render();return}
  if(ds.teamEdit){const tm=S.teams.find(x=>x.id===ds.teamEdit);ui.modal={kind:'team',isNew:false,draft:{...tm}};render();return}
  if(t.id==='team-add'){ui.modal={kind:'team',isNew:true,draft:{id:uid('t'),name:'',desc:''}};render();document.getElementById('m-tname')?.focus();return}
  if(ds.tmove){const i=S.teams.findIndex(x=>x.id===ui.modal.draft.id);move(S.teams,i,+ds.tmove);render();return}
  if(t.id==='login-open'){ui.modal={kind:'login'};render();document.getElementById('m-email')?.focus();return}
  if(t.id==='logout'){await sb.auth.signOut();return}
  if(t.id==='m-signup'){const em=document.getElementById('m-email').value.trim(),pw=document.getElementById('m-pass').value;
    if(!em||pw.length<6){setErr('Введите почту и пароль не короче 6 символов.');return}
    const {error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin}});
    setErr(error?('Не получилось: '+error.message):'Готово. Откройте письмо от Supabase и подтвердите почту, затем войдите здесь.');return}
  if(t.id==='m-cancel'){ui.modal=null;render();return}
  if(t.id==='m-photo-clear'){ui.modal.draft.photo='';render();return}
  if(t.id==='m-del'){
    if(!ui.modal.confirm){ui.modal.confirm=true;render();return}
    const id=ui.modal.draft.id;
    if(ui.modal.kind==='role') S.roles=S.roles.filter(r=>r.id!==id); else {S.teams=S.teams.filter(x=>x.id!==id); if(ui.filter===id) ui.filter='all'}
    ui.modal=null;render();return}
  if(t.id==='m-ok'){
    const {kind,isNew,draft}=ui.modal;
    if(!draft.name.trim()){const f=document.getElementById(kind==='role'?'m-name':'m-tname');f.focus();f.placeholder='Нужно название';return}
    const list=kind==='role'?S.roles:S.teams;
    if(isNew) list.push(draft); else {const i=list.findIndex(x=>x.id===draft.id); list[i]=draft}
    ui.modal=null;render();return}
  if(t.id==='discard'){S=JSON.parse(saved);render();return}
  if(t.id==='save'){save();return}
});
function setErr(m){if(ui.modal)ui.modal.err=m;const e=document.getElementById('m-err');if(e)e.textContent=m}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return; e.preventDefault();
  const em=document.getElementById('m-email').value.trim(),pw=document.getElementById('m-pass').value;
  ui.modal.email=em; setErr('Вхожу…');
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){setErr(/confirm/i.test(error.message)?'Почта ещё не подтверждена. Откройте письмо и нажмите ссылку.':'Неверная почта или пароль.');return}
  ui.modal=null;render();
});
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}

/* ---------- photos ---------- */
async function handlePhoto(file){
  if(!ui.modal) return;
  ui.modal.uploading=true; render();
  try{
    const blob=await shrink(file,600);
    let src='';
    const path='roles/'+uid('p')+'.jpg';
    const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(error) throw error;
    src=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
    if(ui.modal) ui.modal.draft.photo=src;
  }catch(err){
    if(ui.modal) ui.modal.photoErr=true;
  }
  if(ui.modal){ui.modal.uploading=false;render()}
}
function shrink(file,max){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}

/* ---------- save ---------- */
async function save(){
  ui.saving=true;ui.err='';render();
  const {error}=await sb.from('site_content').upsert({id:1,data:S,updated_at:new Date().toISOString()});
  if(error){ui.err='Не удалось сохранить: '+(error.code==='42501'?'нет прав мастера. Войдите заново.':error.message)}
  else saved=JSON.stringify(S);
  ui.saving=false;render();
}
window.addEventListener('beforeunload',e=>{if(ui.master&&dirty()){e.preventDefault();e.returnValue=''}});

/* ---------- boot ---------- */
const hash=(location.hash||'').slice(1);
if(TABS.some(([k])=>k===hash)) ui.tab=hash;
render();
function applySession(s){session=s; ui.canEdit=!!(s&&s.user&&(s.user.email||'').toLowerCase()===MASTER); if(!ui.canEdit) ui.master=false; render()}
sb.auth.getSession().then(({data})=>applySession(data.session));
sb.auth.onAuthStateChange((_ev,s)=>applySession(s));
sb.from('site_content').select('data').eq('id',1).maybeSingle().then(({data,error})=>{
  if(!error&&data&&data.data){S=data.data; saved=JSON.stringify(S)}
  loading=false; render();
});
})();
</script>
