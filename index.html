<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Игра Престолов: Вой по волку</title>
<meta name="description" content="Ролевая игра живого действия «Игра Престолов: Вой по волку»: об игре, лор и сетка ролей.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: sticky iron topbar (sigil + title + tabs) over a torch-lit hero; content column below.
   Lore = sticky index + reading pane; roles = house sections with framed portrait cards. */
:root{
  --bg:#0d0e11; --bg-2:#121318; --surface:#17181e; --raised:#1f2027; --line:#2a2b33;
  --gold:#c9a65e; --gold-hi:#e3c482; --gold-line:rgba(201,166,94,.32);
  --crimson:#8f2b24; --crimson-hi:#ab372e;
  --fg:#ebe4d4; --muted:#9b9485; --ok:#8aac77;
  --display:"Forum","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --tb:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tb) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1120px;margin:0 auto}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(13,14,17,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold-line)}
.tb-row{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{flex:none;width:26px;height:30px}
.brand-name{font-family:var(--display);font-size:21px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{position:relative;background:none;border:0;padding:18px 14px;cursor:pointer;color:var(--muted);
  font-family:var(--display);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--gold)}
.tb-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.icon-btn:hover{color:var(--fg);border-color:var(--gold-line)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--gold-line);
  background:
    radial-gradient(90% 120% at 15% 0%, rgba(143,43,36,.28), transparent 60%),
    radial-gradient(70% 90% at 100% 100%, rgba(201,166,94,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg))}
.hero .col{padding-block:56px 48px;display:grid;gap:18px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,var(--gold),transparent)}
.hero h1{font-size:clamp(38px,7.4vw,82px);color:var(--fg);letter-spacing:.015em}
.hero h1 .sep{color:var(--gold)}
.lead{max-width:64ch;font-size:18px;color:#d8d0bf}
.lead p{margin:0 0 .8em}.lead p:last-child{margin:0}
.hero-mark{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:min(42vw,420px);opacity:.07;pointer-events:none}

/* page */
main.col{padding-block:36px 140px}
.section-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.section-title h2{font-size:clamp(28px,4vw,38px)}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.prose{max-width:68ch}
.prose h3{font-size:30px;margin:1.5em 0 .45em;color:var(--gold-hi)}
.prose h4{font-size:23px;margin:1.3em 0 .35em}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1.1em;padding-left:0;list-style:none}
.prose li{position:relative;padding-left:22px;margin-bottom:.4em}
.prose li::before{content:"";position:absolute;left:4px;top:.68em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prose strong{color:#fff3dc;font-weight:600}
.empty{color:var(--muted);font-style:italic}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:6px;
  padding:9px 16px;font-size:15px;cursor:pointer;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.primary:hover{background:var(--crimson-hi)}
.btn.gold{background:transparent;border-color:var(--gold-line);color:var(--gold-hi)}
.btn.danger{color:#eaa497;border-color:rgba(171,55,46,.6);background:transparent}
.btn.small{padding:5px 11px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:grid;gap:5px;margin-bottom:16px}
.field label,.field .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-line);outline:none}
.field textarea{line-height:1.6;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.edit-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--gold-line);background:rgba(201,166,94,.06);
  border-radius:8px;padding:10px 14px;font-size:14px;color:#d9cfb9;margin-bottom:24px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* lore */
.lore{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:2px;max-height:calc(100vh - var(--tb) - 60px);overflow:auto;padding-right:4px}
.lore-nav .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.lore-item{display:flex;align-items:center}
.lore-link{flex:1;min-width:0;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1.3}
.lore-link:hover{color:var(--fg);background:var(--surface)}
.lore-link[aria-current="true"]{color:var(--gold-hi);background:var(--surface)}
.mv{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:11px}
.lore-article h2{font-size:clamp(32px,5vw,46px);margin-bottom:18px}

/* roles */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:30px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.team{margin-bottom:52px}
.team-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.team-head h2{font-size:clamp(28px,4vw,36px)}
.team-count{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums;padding-bottom:5px}
.team-head .actions{margin-left:auto}
.team-rule{height:1px;background:linear-gradient(90deg,var(--gold-line),transparent);margin-bottom:12px}
.team-desc{color:var(--muted);margin:0 0 20px;max-width:68ch;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold-line)}
.portrait{position:relative;aspect-ratio:3/4;max-width:100%;background:radial-gradient(80% 60% at 50% 35%,#24252d,#121318);display:grid;place-items:center;overflow:hidden}
.portrait::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,166,94,.22);border-radius:3px;pointer-events:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .initial{font-family:var(--display);font-size:84px;color:rgba(201,166,94,.28)}
.card-body{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.card h3{font-size:24px;line-height:1.05}
.rtitle{font-size:14px;color:var(--gold);font-style:italic}
.card p{margin:2px 0 0;font-size:15px;line-height:1.5;color:#d6cebd}
.status{justify-self:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-top:6px}
.status.free{color:var(--ok);border:1px solid rgba(138,172,119,.45)}
.status.taken{color:var(--muted);border:1px solid var(--line)}
.card-tools{display:flex;gap:6px;padding:0 16px 14px}
.add-card{border:1px dashed var(--gold-line);border-radius:8px;background:rgba(201,166,94,.03);color:var(--gold);cursor:pointer;min-height:200px;font-size:16px;font-family:var(--display);letter-spacing:.05em}
.add-card:hover{background:rgba(201,166,94,.07)}

/* save bar, modal, toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(31,32,39,.97);border-top:1px solid var(--gold-line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .msg{flex:1;min-width:160px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border:1px solid var(--gold-line);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px}
.modal h2{font-size:30px;margin-bottom:18px}
.modal .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal .foot .grow{flex:1}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .thumb{width:84px;aspect-ratio:3/4;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;flex:none}
.photo-pick .thumb img{width:100%;height:100%;object-fit:cover}
.pin-input{text-align:center;font-family:var(--display);font-size:34px!important;letter-spacing:.5em;padding-left:calc(12px + .5em)!important}
.err{color:#eaa497;font-size:14px;min-height:1.3em;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--gold);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
footer.col{padding-block:0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}

/* mobile */
@media (max-width:820px){
  .tb-row{flex-wrap:wrap;gap:0;min-height:0}
  .brand{flex:1;padding:10px 0}
  .brand-name{font-size:19px}
  .tabs{order:3;width:100%;margin:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid var(--line)}
  .tab{padding:11px 4px;font-size:16px;text-align:center}
  .tab[aria-selected="true"]::after{left:18%;right:18%}
  .icon-btn .lbl{display:none}
  .icon-btn{padding:8px}
  .hero .col{padding-block:36px 32px}
  .lead{font-size:16.5px}
  .hero-mark{width:60vw;right:-60px;opacity:.06}
  main.col{padding-block:26px 130px}
  .lore{grid-template-columns:1fr;gap:18px}
  .lore-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:6px;overflow-x:auto;max-height:none;padding:10px 0;margin:0 -16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .lore-nav::-webkit-scrollbar{display:none}
  .lore-nav .cap{display:none}
  .lore-item{flex:none}
  .lore-link{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
  .lore-link[aria-current="true"]{border-color:var(--gold);background:transparent}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-body{padding:10px 12px 12px}
  .card h3{font-size:20px}
  .card p{font-size:14px}
  .card-tools{padding:0 12px 12px;flex-wrap:wrap}
  .add-card{min-height:160px}
  .modal-bg{place-items:end center;padding:0}
  .modal{width:100%;border-radius:16px 16px 0 0;max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}

/* legends (master only) */
.tab .short{display:none}
.lg{display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;align-items:start}
.lg-nav{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - var(--tb) - 60px);overflow:auto;padding-right:4px;display:grid;gap:2px}
.lg-search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:15px;margin-bottom:10px}
.lg-search:focus{border-color:var(--gold-line);outline:none}
.lg-cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:12px 12px 4px}
.lg-link{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:15px;line-height:1.3;width:100%}
.lg-link:hover{color:var(--fg);background:var(--surface)}
.lg-link[aria-current="true"]{color:var(--gold-hi);background:var(--surface)}
.lg-dot{flex:none;width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.lg-dot.full{background:var(--gold);border-color:var(--gold)}
.lg-select{display:none;width:100%;background:var(--bg);border:1px solid var(--gold-line);border-radius:6px;padding:10px 12px;font-size:16px;margin-bottom:14px}
.lg-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.lg-head .ph{width:64px;aspect-ratio:3/4;border-radius:5px;overflow:hidden;border:1px solid var(--gold-line);flex:none;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:rgba(201,166,94,.4)}
.lg-head .ph img{width:100%;height:100%;object-fit:cover}
.lg-head h2{font-size:clamp(28px,4.4vw,40px)}
.lg-meta{color:var(--gold);font-style:italic;font-size:15px}
.lg-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lg-status{font-size:13px;color:var(--muted);margin-left:auto}
.lg-toolbar{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:4px;flex-wrap:wrap;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:12px}
.lg-tool{border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:5px;min-width:34px;height:34px;padding:0 9px;font-size:14px;cursor:pointer}
.lg-tool:hover{border-color:var(--gold-line)}
.lg-tool.wide{color:var(--gold-hi);border-color:var(--gold-line);background:transparent}
.lg-sep{width:1px;background:var(--line);margin:4px 2px}
.lg-editor{min-height:55vh;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 28px;line-height:1.7;outline:none;overflow-wrap:anywhere}
.lg-editor:focus{border-color:var(--gold-line)}
.lg-editor:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.lg-editor > :first-child{margin-top:0}
.lg-editor p,.lg-editor div{margin:0 0 .9em}
.lg-editor h2{font-size:30px;margin:1.2em 0 .4em;color:var(--gold-hi)}
.lg-editor h3{font-size:23px;margin:1.1em 0 .35em}
.lg-editor ul,.lg-editor ol{margin:0 0 1em;padding-left:1.4em}
.lg-editor blockquote{margin:0 0 1em;padding:4px 0 4px 16px;border-left:2px solid var(--gold);color:#cfc6b4;font-style:italic}
.lg-editor img{display:block;max-width:100%;height:auto;border-radius:5px;margin:12px 0;border:1px solid var(--line)}
.role-link{color:var(--gold-hi);background:rgba(201,166,94,.1);border:1px solid var(--gold-line);border-radius:4px;padding:0 6px;text-decoration:none;cursor:pointer;white-space:nowrap}
.role-link:hover{background:rgba(201,166,94,.2)}
.lore-ref{color:#c3d0dc;background:rgba(147,170,187,.1);border:1px solid rgba(147,170,187,.38);border-radius:4px;padding:0 6px;text-decoration:none;cursor:pointer;white-space:nowrap;font-style:italic}
.lore-ref:hover{background:rgba(147,170,187,.2)}
.lore-ref.missing{color:var(--muted);text-decoration:line-through;border-color:var(--line);background:none}
.lr-plain{color:#c3d0dc;font-weight:600;font-style:italic;cursor:help;border-bottom:1px dotted rgba(147,170,187,.55)}
.hovercard.lore .hc-ph{width:46px;aspect-ratio:1;border-color:rgba(147,170,187,.38);color:#c3d0dc}
.hovercard.lore .hc-name{color:#dfe7ee}
.hc-ex{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px}
.hovercard.lore{max-width:min(340px,calc(100vw - 16px));align-items:flex-start}
.role-link.missing{color:var(--muted);text-decoration:line-through;border-color:var(--line);background:none}
.lg-back{margin-top:16px;font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lg-pin{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding:10px 12px;border:1px dashed var(--gold-line);border-radius:8px;background:rgba(201,166,94,.04)}
.lg-pin label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lg-pin input{width:130px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:17px;letter-spacing:.25em;text-align:center}
.lg-pin input:focus{border-color:var(--gold-line);outline:none}
.lg-pin .hint{flex-basis:100%}
.lg-pinmark{margin-left:auto;font-size:10px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold-line);border-radius:3px;padding:0 4px;line-height:1.5}
.modal.wide{width:min(820px,100%)}
.lg-editor.reader{min-height:0!important}
.reader{min-height:0;background:transparent;border:0;padding:4px 0 0;border-radius:0}
.reader:focus{border:0}
.rl-plain{color:var(--gold-hi);font-weight:600;cursor:help;border-bottom:1px dotted var(--gold-line)}
.hovercard{position:fixed;z-index:90;display:flex;gap:12px;align-items:center;max-width:min(300px,calc(100vw - 16px));background:var(--surface);
  border:1px solid var(--gold-line);border-radius:10px;padding:10px 16px 10px 10px;box-shadow:0 12px 32px rgba(0,0,0,.55);pointer-events:none;
  opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.hovercard.on{opacity:1;transform:none}

async function handlePhoto(file){

  ui.modal.uploading=true;ui.modal.photoErr='';render();

    const id=uid('p');
    const {data,error}=await sb.rpc('save_role_photo',{p_pin:pin,p_id:id,p_data:dataUrl});
    if(error)throw new Error(rpcErr(error));
    if(!data)throw new Error('Код мастера больше не подходит. Войдите заново.');
    photos[id]=dataUrl;
    if(ui.modal)ui.modal.draft.photo='ph:'+id;
  }catch(e){if(ui.modal)ui.modal.photoErr=e.message||'Не получилось загрузить фото. Попробуйте JPG или PNG.'}
  if(ui.modal){ui.modal.uploading=false;render()}
}
function shrink(file,max){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не получилось прочитать файл. Попробуйте JPG или PNG.'))};
    img.src=url;
  });
}

function orderedRoles(){

}
const hasText=html=>/<img/i.test(html||'')||(html||'').replace(/<[^>]*>/g,'').replace(/&nbsp;|\s/g,'').length>0;
function sanitize(html){
  const tpl=document.createElement('template'); tpl.innerHTML=html||'';
  const OK=new Set(['P','DIV','H2','H3','H4','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','BR','BLOCKQUOTE','IMG','A']);
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','SVG','VIDEO','AUDIO','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);
  const strip=n=>[...n.attributes].forEach(a=>n.removeAttribute(a.name));
  (function walk(node){
    [...node.childNodes].forEach(n0=>{
      let n=n0;
      if(n.nodeType===3) return;
      if(n.nodeType!==1){n.remove();return}
      if(DROP.has(n.tagName)){n.remove();return}
      if(n.tagName==='H1'){const x=document.createElement('h2');x.append(...n.childNodes);n.replaceWith(x);n=x}
      if(!OK.has(n.tagName)){walk(n);n.replaceWith(...n.childNodes);return}
      if(n.tagName==='IMG'){const src=n.getAttribute('src')||'';strip(n);if(!/^data:image\/(png|jpe?g|webp|gif);/i.test(src)){n.remove();return}n.setAttribute('src',src);return}
      if(n.tagName==='A'&&n.getAttribute('data-loreref')){
        const lid=n.getAttribute('data-loreref'), a=S.lore.find(x=>x.id===lid), label=n.textContent; strip(n);
        n.setAttribute('data-loreref',lid);n.setAttribute('contenteditable','false');n.className='lore-ref'+(a?'':' missing');
        n.textContent=a?(a.title||'Без названия'):(label||'статья удалена');return}
      if(n.tagName==='A'){
        const rid=n.getAttribute('data-role'); if(!rid){walk(n);n.replaceWith(...n.childNodes);return}
        const r=S.roles.find(x=>x.id===rid), label=n.textContent; strip(n);
        n.setAttribute('data-role',rid);n.setAttribute('contenteditable','false');n.className='role-link'+(r?'':' missing');
        n.textContent=r?r.name:(label||'роль удалена');return}
      strip(n);walk(n);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

// caret positions are stored as child-index paths: live Range objects collapse when the editor is re-attached
function pathOf(n,root){const p=[];while(n&&n!==root){const par=n.parentNode;if(!par)return null;p.unshift([...par.childNodes].indexOf(n));n=par}return n===root?p:null}
function nodeAt(p,root){let n=root;for(const i of p){n=n&&n.childNodes[i];}return n||null}
function rangeToPath(ed){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;const r=s.getRangeAt(0);const a=pathOf(r.startContainer,ed),b=pathOf(r.endContainer,ed);return a&&b?{a,ao:r.startOffset,b,bo:r.endOffset}:null}
function pathToRange(ed,p){const s=getSelection();s.removeAllRanges();const r=document.createRange();
  try{const a=nodeAt(p.a,ed),b=nodeAt(p.b,ed);if(!a||!b)throw 0;r.setStart(a,p.ao);r.setEnd(b,p.bo)}catch(_){r.selectNodeContents(ed);r.collapse(false)}
  s.addRange(r)}
function saveRange(){const ed=document.getElementById('lg-editor');lgRange=ed?rangeToPath(ed):null}
function restoreRange(){
  const ed=document.getElementById('lg-editor'); if(!ed) return false;
  ed.focus({preventScroll:true});
  if(lgRange) pathToRange(ed,lgRange); else {const s=getSelection(),r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}
  return true;
}
function insertAtSaved(html){
  if(!restoreRange())return;
  const sel=getSelection(), r=sel.getRangeAt(0); r.deleteContents();
  const tpl=document.createElement('template'); tpl.innerHTML=html; const last=tpl.content.lastChild;
  r.insertNode(tpl.content);
  if(last){const nr=document.createRange();nr.setStartAfter(last);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr)}
  scheduleLegendSave();
}

const LORE_ICON=`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 4h10a2 2 0 0 1 2 2v12a2 2 0 0 0 2 2H8a2 2 0 0 1-2-2V4z"/><path d="M6 4a2 2 0 0 0-2 2v2h2M9.5 8.5h5M9.5 12h5M9.5 15.5h3"/></svg>`;

  }else{

/* ---------------- Word export ---------------- */
function loadDocx(){
  if(window.docx) return Promise.resolve();
  if(!docxReady) docxReady=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';sc.onload=res;sc.onerror=()=>{docxReady=null;rej(new Error('lib'))};document.head.appendChild(sc)});
  return docxReady;
}
function dataToBytes(d){const b=atob(d.slice(d.indexOf(',')+1));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function imgSize(d){return new Promise(res=>{const i=new Image();i.onload=()=>res({w:i.naturalWidth||400,h:i.naturalHeight||300});i.onerror=()=>res({w:400,h:300});i.src=d})}
async function imageRun(D,d,maxW){const {w,h:hh}=await imgSize(d);const k=Math.min(1,maxW/w);return new D.ImageRun({data:dataToBytes(d),transformation:{width:Math.round(w*k),height:Math.round(hh*k)}})}
async function htmlToParas(D,html,all){
  const tpl=document.createElement('template'); tpl.innerHTML=sanitize(html);
  const BLOCK=new Set(['P','DIV','H2','H3','H4','UL','OL','BLOCKQUOTE','IMG']);
  const paras=[]; let buf=[];
  const flush=()=>{if(buf.length){paras.push(new D.Paragraph({children:buf,spacing:{after:160}}));buf=[]}};
  async function runs(node,fmt){
    const out=[];
    for(const n of node.childNodes){
      if(n.nodeType===3){const tx=n.textContent.replace(/ /g,' ');if(tx)out.push(new D.TextRun({text:tx,...fmt}));continue}
      if(n.nodeType!==1) continue;
      const tg=n.tagName;
      if(tg==='BR'){out.push(new D.TextRun({text:'',break:1}));continue}
      if(tg==='IMG'){out.push(await imageRun(D,n.getAttribute('src'),430));continue}
      if(tg==='A'&&n.getAttribute('data-loreref')){out.push(new D.TextRun({text:n.textContent,...fmt,italics:true,color:'4F6B7D'}));continue}
      if(tg==='A'){const rid=n.getAttribute('data-role');const tr=new D.TextRun({text:n.textContent,...fmt,color:'8A6A2B',underline:{}});
        out.push(all&&exportIds.has(rid)?new D.InternalHyperlink({anchor:'role_'+rid,children:[tr]}):tr);continue}
      const f={...fmt};
      if(tg==='B'||tg==='STRONG')f.bold=true; if(tg==='I'||tg==='EM')f.italics=true; if(tg==='U')f.underline={}; if(tg==='S'||tg==='STRIKE')f.strike=true;
      if(BLOCK.has(tg)&&out.length)out.push(new D.TextRun({text:'',break:1}));
      out.push(...await runs(n,f));
    }
    return out;
  }
  for(const n of tpl.content.childNodes){
    if(n.nodeType===3){if(n.textContent.trim())buf.push(new D.TextRun(n.textContent.replace(/ /g,' ')));continue}
    if(n.nodeType!==1) continue;
    const tg=n.tagName;
    if(!BLOCK.has(tg)){buf.push(...await runs({childNodes:[n]},{}));continue}
    flush();
    if(tg==='H2'||tg==='H3'||tg==='H4') paras.push(new D.Paragraph({heading:tg==='H2'?D.HeadingLevel.HEADING_2:D.HeadingLevel.HEADING_3,children:await runs(n,{})}));
    else if(tg==='UL'||tg==='OL'){let i=0;for(const li of n.children){i++;const ch=await runs(li,{});paras.push(tg==='UL'?new D.Paragraph({bullet:{level:0},children:ch}):new D.Paragraph({children:[new D.TextRun(i+'. '),...ch],indent:{left:360,hanging:360}}))}}
    else if(tg==='BLOCKQUOTE') paras.push(new D.Paragraph({children:await runs(n,{italics:true}),indent:{left:567},spacing:{after:160},border:{left:{style:D.BorderStyle.SINGLE,size:12,color:'C9A65E',space:8}}}));
    else if(tg==='IMG') paras.push(new D.Paragraph({children:[await imageRun(D,n.getAttribute('src'),430)],spacing:{after:160}}));
    else{const ch=await runs(n,{});paras.push(new D.Paragraph({children:ch.length?ch:[new D.TextRun('')],spacing:{after:160}}))}
  }
  flush();
  return paras;
}
async function roleSection(D,x,all,override){
  const r=x.r, out=[], name=new D.TextRun(r.name);
  out.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_1,pageBreakBefore:all,children:all?[new D.Bookmark({id:'role_'+r.id,children:[name]})]:[name]}));
  const meta=[x.t?.name,r.title,r.player?'Игрок: '+r.player:''].filter(Boolean).join(' · ');
  if(meta) out.push(new D.Paragraph({children:[new D.TextRun({text:meta,italics:true,color:'8A6A2B'})],spacing:{after:200}}));
  const src=photoSrc(r.photo); if(src) out.push(new D.Paragraph({children:[await imageRun(D,src,170)],spacing:{after:200}}));
  const html=override!=null?override:(LG&&LG[r.id]?.html)||'';
  if(hasText(html)) out.push(...await htmlToParas(D,html,all));
  else out.push(new D.Paragraph({children:[new D.TextRun({text:'Легенда ещё не написана.',italics:true,color:'888888'})]}));
  return out;
}
async function exportDocx(all,opt){
  const st=opt&&opt.status||setStatus;
  if(!opt) flushLegend(); st('Готовлю файл Word…');
  try{
    await loadDocx(); const D=window.docx;
    const list=all?orderedRoles():orderedRoles().filter(x=>x.r.id===(opt?opt.role:ui.legend));
    exportIds=new Set(list.map(x=>x.r.id));
    const ch=[];
    if(all){
      ch.push(new D.Paragraph({heading:D.HeadingLevel.TITLE,children:[new D.TextRun(S.hero.title)]}));
      ch.push(new D.Paragraph({children:[new D.TextRun({text:'Легенды персонажей',italics:true,color:'8A6A2B',size:28})],spacing:{after:300}}));
      let lastT=null;
      list.forEach(x=>{const tn=x.t?x.t.name:'Без команды';
        if(tn!==lastT){ch.push(new D.Paragraph({heading:D.HeadingLevel.HEADING_3,children:[new D.TextRun(tn)]}));lastT=tn}
        ch.push(new D.Paragraph({children:[new D.InternalHyperlink({anchor:'role_'+x.r.id,children:[new D.TextRun({text:x.r.name,color:'8A6A2B',underline:{}})]}),new D.TextRun({text:x.r.title?' · '+x.r.title:'',color:'777777'})]}))});
    }
    for(const x of list) ch.push(...await roleSection(D,x,all,opt?opt.html:null));
    const doc=new D.Document({creator:S.hero.title,title:all?'Легенды':'Легенда: '+list[0].r.name,
      styles:{default:{document:{run:{font:'Georgia',size:23}},title:{run:{font:'Georgia',size:52,color:'5A1E19'}},heading1:{run:{font:'Georgia',size:40,color:'5A1E19'},paragraph:{spacing:{after:120}}},heading2:{run:{font:'Georgia',size:30,color:'8A6A2B'},paragraph:{spacing:{before:240,after:120}}},heading3:{run:{font:'Georgia',size:26,bold:true},paragraph:{spacing:{before:200,after:80}}}}},
      sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:ch}]});
    const blob=await D.Packer.toBlob(doc);
    const fname=((all?'Легенды — '+S.hero.title:'Легенда — '+list[0].r.name).replace(/[\\/:*?"<>|]+/g,' ').trim())+'.docx';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    st('Файл Word скачан');
  }catch(e){console.error(e);st('Не получилось собрать файл Word. Проверьте интернет и попробуйте ещё раз.')}
}
